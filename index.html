<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Modern Snake Oyunu</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐍</text></svg>">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            /* Modern Color Palette */
            --primary: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --secondary: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            --accent: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            --success: linear-gradient(135deg, #43e97b 0%, #38f9d7 100%);
            --warning: linear-gradient(135deg, #fa709a 0%, #fee140 100%);
            --danger: linear-gradient(135deg, #ff6b6b 0%, #ee5a24 100%);
            
            /* Glassmorphism */
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
            --glass-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            
            /* Dark theme */
            --bg-primary: linear-gradient(135deg, #0c0c0c 0%, #1a1a2e 50%, #16213e 100%);
            --bg-secondary: rgba(30, 30, 40, 0.8);
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --surface: rgba(45, 45, 60, 0.9);
            
            /* Game specific */
            --canvas-bg: #0a0a0a;
            --snake-default: #00ff88;
            --food-color: #ff6b35;
            --obstacle-color: #4a4a5a;
            
            /* Animations */
            --transition-fast: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-normal: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-slow: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            
            /* Spacing */
            --space-xs: 4px;
            --space-sm: 8px;
            --space-md: 16px;
            --space-lg: 24px;
            --space-xl: 32px;
            
            /* Border radius */
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --radius-xl: 24px;
            --radius-full: 9999px;
        }

        .light-theme {
            --bg-primary: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --bg-secondary: rgba(255, 255, 255, 0.9);
            --text-primary: #2d3748;
            --text-secondary: #718096;
            --surface: rgba(255, 255, 255, 0.95);
            --canvas-bg: #1a202c;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: fixed;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* Modern Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--glass-bg);
            border-radius: var(--radius-full);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--glass-border);
        }

        /* Glass Card Component */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            box-shadow: var(--glass-shadow);
            transition: var(--transition-normal);
        }

        .glass-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px 0 rgba(31, 38, 135, 0.5);
        }

        /* Modern Button */
        .btn {
            position: relative;
            padding: var(--space-md) var(--space-lg);
            border: none;
            border-radius: var(--radius-md);
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition-fast);
            overflow: hidden;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: var(--space-sm);
            min-height: 44px;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: var(--glass-bg);
            color: var(--text-primary);
            border: 1px solid var(--glass-border);
        }

        .btn:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        /* Game Container */
        .game-container {
            display: flex;
            height: 100vh;
            width: 100vw;
            gap: var(--space-lg);
            padding: var(--space-lg);
            align-items: stretch;
        }

        .sidebar {
            flex: 0 0 320px;
            display: flex;
            flex-direction: column;
            gap: var(--space-md);
            overflow-y: auto;
        }

        .main-game {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--space-md);
            padding: var(--space-lg);
        }

        .stat-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-radius: var(--radius-md);
            padding: var(--space-lg);
            text-align: center;
            border: 1px solid var(--glass-border);
            transition: var(--transition-normal);
        }

        .stat-card:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.15);
        }

        .stat-value {
            font-size: 24px;
            font-weight: 700;
            background: var(--primary);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: var(--space-xs);
        }

        .stat-label {
            font-size: 12px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Lives Display */
        .lives-display {
            display: flex;
            justify-content: center;
            gap: var(--space-sm);
            padding: var(--space-lg);
        }

        .heart {
            font-size: 20px;
            transition: var(--transition-fast);
            filter: drop-shadow(0 2px 4px rgba(255, 75, 87, 0.3));
        }

        .heart.empty {
            opacity: 0.3;
            filter: grayscale(1);
        }

        .heart:not(.empty) {
            animation: heartbeat 2s infinite;
        }

        @keyframes heartbeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* Canvas Styles */
        #gameCanvas {
            border-radius: var(--radius-lg);
            background: var(--canvas-bg);
            box-shadow: 
                0 0 0 1px rgba(255, 255, 255, 0.1),
                0 8px 32px rgba(0, 0, 0, 0.3),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
            margin: auto;
            display: block;
            max-width: 100%;
            max-height: 100%;
            image-rendering: pixelated;
            transition: var(--transition-normal);
        }

        #gameCanvas:hover {
            box-shadow: 
                0 0 0 1px rgba(255, 255, 255, 0.2),
                0 12px 40px rgba(0, 0, 0, 0.4),
                inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        /* Progress Bar */
        .progress-container {
            background: rgba(0, 0, 0, 0.2);
            border-radius: var(--radius-full);
            height: 8px;
            margin: var(--space-md) 0;
            overflow: hidden;
            position: relative;
        }

        .progress-bar {
            height: 100%;
            background: var(--success);
            border-radius: var(--radius-full);
            transition: width 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .progress-bar::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: shimmer 2s infinite;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        /* Control Menu */
        .control-menu {
            display: flex;
            flex-wrap: wrap;
            gap: var(--space-sm);
            margin-bottom: var(--space-lg);
        }

        /* Inventory */
        .inventory {
            padding: var(--space-lg);
        }

        .inventory-title {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: var(--space-md);
            text-align: center;
            background: var(--accent);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: var(--space-sm);
        }

        .inventory-item {
            aspect-ratio: 1;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            transition: var(--transition-fast);
            position: relative;
            backdrop-filter: blur(10px);
            min-height: 44px;
        }

        .inventory-item:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-2px);
        }

        .inventory-item:active {
            transform: scale(0.95);
        }

        .inventory-count {
            position: absolute;
            top: -4px;
            right: -4px;
            background: var(--danger);
            color: white;
            font-size: 10px;
            font-weight: 600;
            width: 20px;
            height: 20px;
            border-radius: var(--radius-full);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid var(--canvas-bg);
        }

        .inventory-item.active {
            background: var(--accent);
            color: white;
            box-shadow: 0 0 20px rgba(79, 172, 254, 0.6);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 20px rgba(79, 172, 254, 0.6); }
            50% { box-shadow: 0 0 30px rgba(79, 172, 254, 0.8); }
        }

        /* Theme Toggle */
        .theme-toggle {
            position: fixed;
            top: var(--space-lg);
            right: var(--space-lg);
            width: 48px;
            height: 48px;
            border-radius: var(--radius-full);
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(20px);
            color: var(--text-primary);
            font-size: 20px;
            cursor: pointer;
            transition: var(--transition-fast);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .theme-toggle:hover {
            transform: scale(1.1) rotate(180deg);
            background: rgba(255, 255, 255, 0.2);
        }

        /* Mobile Styles */
        @media (max-width: 768px) {
            .game-container {
                flex-direction: column;
                padding: var(--space-sm);
                gap: var(--space-sm);
            }

            .sidebar {
                flex: none;
                order: 2;
            }

            .main-game {
                order: 1;
                flex: 1;
            }

            .stats-grid {
                grid-template-columns: repeat(4, 1fr);
                padding: var(--space-md);
                gap: var(--space-sm);
            }

            .stat-card {
                padding: var(--space-md);
            }

            .stat-value {
                font-size: 18px;
            }

            .stat-label {
                font-size: 10px;
            }

            .inventory-grid {
                grid-template-columns: repeat(5, 1fr);
            }

            .control-menu {
                display: none;
            }

            #gameCanvas {
                max-height: 60vh;
            }
        }

        /* Mobile Controls */
        .mobile-controls {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--glass-border);
            padding: var(--space-lg);
            z-index: 100;
            transition: transform 0.3s ease-in-out;
        }

        .mobile-controls.hidden {
            transform: translateY(100%);
        }

        .mobile-toggle {
            display: none;
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-full);
            width: 50px;
            height: 30px;
            color: var(--text-primary);
            font-size: 16px;
            cursor: pointer;
            transition: var(--transition-fast);
            z-index: 101;
            align-items: center;
            justify-content: center;
        }

        .mobile-toggle:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateX(-50%) scale(1.1);
        }

        @media (max-width: 768px) {
            .mobile-controls {
                display: flex;
                justify-content: space-between;
                align-items: center;
                gap: var(--space-lg);
            }

            .mobile-toggle {
                display: flex;
            }
        }

        .dpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: var(--space-xs);
            width: 180px;
            height: 180px;
        }

        .dpad-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 22px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-fast);
            backdrop-filter: blur(10px);
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .dpad-btn:active {
            background: var(--accent);
            color: white;
            transform: scale(0.9);
        }

        .dpad-btn.up { grid-area: 1/2; }
        .dpad-btn.left { grid-area: 2/1; }
        .dpad-btn.right { grid-area: 2/3; }
        .dpad-btn.down { grid-area: 3/2; }

        .zoom-controls {
            display: flex;
            flex-direction: column;
            gap: var(--space-xs);
            margin-left: var(--space-sm);
        }

        .zoom-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            color: var(--text-primary);
            font-size: 16px;
            font-weight: bold;
            width: 35px;
            height: 35px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-fast);
            backdrop-filter: blur(10px);
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .zoom-btn:active {
            background: var(--success);
            color: white;
            transform: scale(0.9);
        }

        .action-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: var(--space-sm);
            width: 120px;
        }

        .action-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-md);
            padding: var(--space-sm);
            color: var(--text-primary);
            font-size: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--space-xs);
            transition: var(--transition-fast);
            backdrop-filter: blur(10px);
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            min-height: 48px;
        }

        .action-btn:active {
            background: var(--primary);
            color: white;
            transform: scale(0.95);
        }

        .action-btn .icon {
            font-size: 16px;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: var(--space-lg);
        }

        .modal-content {
            background: var(--surface);
            backdrop-filter: blur(20px);
            border-radius: var(--radius-xl);
            padding: var(--space-xl);
            max-width: 600px;
            width: 100%;
            max-height: 80vh;
            overflow-y: auto;
            border: 1px solid var(--glass-border);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            transform: scale(0.9);
            transition: var(--transition-normal);
        }

        .modal.show .modal-content {
            transform: scale(1);
        }

        .modal-title {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: var(--space-lg);
            text-align: center;
            background: var(--primary);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Shop Grid */
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: var(--space-md);
            margin: var(--space-lg) 0;
        }

        .shop-item {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-lg);
            padding: var(--space-lg);
            text-align: center;
            transition: var(--transition-normal);
        }

        .shop-item:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.15);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
        }

        .shop-item-icon {
            font-size: 32px;
            margin-bottom: var(--space-md);
        }

        .shop-item-title {
            font-weight: 600;
            margin-bottom: var(--space-sm);
            color: var(--text-primary);
        }

        .shop-item-desc {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: var(--space-md);
        }

        .shop-item-price {
            color: var(--text-primary);
            font-weight: 600;
            margin-bottom: var(--space-md);
        }

        /* Notifications */
        .notification {
            position: fixed;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius-xl);
            padding: var(--space-lg) var(--space-xl);
            color: var(--text-primary);
            font-weight: 600;
            z-index: 3000;
            display: none;
            animation: slideInDown 0.3s ease-out;
        }

        .notification.show {
            display: block;
            animation: slideInDown 0.3s ease-out;
        }

        .notification.hide {
            animation: slideOutUp 0.3s ease-in forwards;
        }

        @keyframes slideInDown {
            from {
                opacity: 0;
                transform: translate(-50%, -30px);
            }
            to {
                opacity: 1;
                transform: translate(-50%, 0);
            }
        }

        @keyframes slideOutUp {
            from {
                opacity: 1;
                transform: translate(-50%, 0);
            }
            to {
                opacity: 0;
                transform: translate(-50%, -30px);
            }
        }

        /* Game Over Effects */
        .game-over {
            animation: gameOverShake 0.5s ease-in-out;
        }

        @keyframes gameOverShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* Level Up Effects */
        .level-up {
            animation: levelUpGlow 1s ease-in-out;
        }

        @keyframes levelUpGlow {
            0%, 100% { filter: brightness(1); }
            50% { filter: brightness(1.2) hue-rotate(90deg); }
        }

        /* Accessibility */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Focus styles */
        .btn:focus,
        .inventory-item:focus,
        .dpad-btn:focus,
        .action-btn:focus {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }

        /* High contrast mode */
        @media (prefers-contrast: high) {
            :root {
                --glass-bg: rgba(255, 255, 255, 0.9);
                --glass-border: rgba(0, 0, 0, 0.3);
                --text-primary: #000000;
                --text-secondary: #333333;
            }
        }

        /* Loading Animation */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 2px solid var(--glass-border);
            border-radius: 50%;
            border-top-color: var(--text-primary);
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Ripple Effect */
        .ripple {
            position: relative;
            overflow: hidden;
        }

        .ripple:before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .ripple:active:before {
            width: 300px;
            height: 300px;
        }
    </style>
</head>
<body>
    <!-- Theme Toggle -->
    <button class="theme-toggle" onclick="toggleTheme()">🌓</button>
    
    <!-- Main Game Container -->
    <div class="game-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <!-- Stats -->
            <div class="glass-card">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-value" id="score">0</div>
                        <div class="stat-label">Skor</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-value" id="level">1</div>

            <!-- Lives -->

    <div class="modal" id="gameOverModal">
        <div class="modal-content">
            <h2 class="modal-title" id="gameOverTitle">Oyun Bitti!</h2>

                <button class="btn btn-primary ripple" onclick="resetGame()">Yeniden Başla</button>

    <!-- Notification -->
    <div class="notification" id="notification"></div>
    
    <script>
        // Game State Management
        class GameState {
            constructor() {
                this.snake = [];
                this.direction = 'right';
                this.nextDirection = 'right';
                this.food = null;
                this.specialItems = [];
                this.obstacles = [];
                this.enemies = [];
                this.boss = null;
                this.particles = [];
                this.score = 0;
                this.level = 1;
                this.coins = 0;
                this.lives = 3;
                this.highScore = 0;
                this.isPaused = false;
                this.isGameOver = false;
                this.soundEnabled = true;
                this.autoplayEnabled = false;
                this.gameSpeed = 180;
                this.frameCount = 0;
                this.theme = null;
                this.zoomLevel = 1;
                this.speedMode = 'normal'; // slow, normal, fast
            }

            reset() {
                this.snake = [
                    { x: Math.floor(GRID_WIDTH / 2), y: Math.floor(GRID_HEIGHT / 2) },
                    { x: Math.floor(GRID_WIDTH / 2) - 1, y: Math.floor(GRID_HEIGHT / 2) },
                    { x: Math.floor(GRID_WIDTH / 2) - 2, y: Math.floor(GRID_HEIGHT / 2) }
                ];
                this.direction = 'right';
                this.nextDirection = 'right';
                this.score = 0;
                this.level = 1;
                this.lives = 3;
                this.isPaused = false;
                this.isGameOver = false;
                this.gameSpeed = 180;
                this.frameCount = 0;
                this.enemies = [];
                this.boss = null;
                this.particles = [];
                this.specialItems = [];
            }
        }

        // Game Constants
        const CELL_SIZE = 20;
        const GRID_WIDTH = 30;
        const GRID_HEIGHT = 30;

        // Game Variables
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const gameState = new GameState();

        // Set canvas size
        canvas.width = GRID_WIDTH * CELL_SIZE;
        canvas.height = GRID_HEIGHT * CELL_SIZE;

        // Power-ups and Inventory
        const powerUps = {
            shield: false,
            speed: false,
            double: false,
            ghost: false,
            freeze: false
        };

        const inventory = {
            shield: 10,
            speed: 10,
            double: 10,
            ghost: 10,
            freeze: 10
        };

        // Level definitions
        const levels = [
            {
                name: "Başlangıç",
                theme: { bg: '#0a0a0a', food: '#ff6b35', snake: '#00ff88' },
                enemyCount: 0,
                obstaclePattern: 'simple',
                speed: 180
            },
            {
                name: "İlk Adım",
                theme: { bg: '#0f0f0f', food: '#ffd700', snake: '#00ced1' },
                enemyCount: 1,
                obstaclePattern: 'walls',
                speed: 160
            },
            {
                name: "Hızlanma",
                theme: { bg: '#1a0f1a', food: '#ff69b4', snake: '#9370db' },
                enemyCount: 1,
                obstaclePattern: 'corners',
                speed: 140
            },
            {
                name: "Zorluk Artıyor",
                theme: { bg: '#0f1a1a', food: '#ffa500', snake: '#ff1493' },
                enemyCount: 2,
                obstaclePattern: 'center',
                speed: 120
            },
            {
                name: "Boss Savaşı",
                theme: { bg: '#1a0f0f', food: '#ff0000', snake: '#ffffff' },
                enemyCount: 0,
                obstaclePattern: 'boss',
                speed: 100,
                boss: true
            }
        ];

        // Audio Context for sound effects
        let audioContext;
        let audioInitialized = false;

        function initAudio() {
            if (audioInitialized) return;
            
            try {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
                audioInitialized = true;
                console.log('Audio context initialized');
            } catch (e) {
                console.warn('Web Audio API not supported:', e);
            }
        }

        // Sound Effects
        function playSound(type) {
            if (!gameState.soundEnabled) return;
            
            // Initialize audio on first sound attempt
            if (!audioInitialized) {
                initAudio();
            }
            
            if (!audioContext) return;
            
            // Resume audio context if suspended
            if (audioContext.state === 'suspended') {
                audioContext.resume().then(() => {
                    playTone(type);
                }).catch(e => {
                    console.warn('Could not resume audio context:', e);
                });
                return;
            }
            
            playTone(type);
        }

        function playTone(type) {
            try {
                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                switch(type) {
                    case 'eat':
                        oscillator.frequency.value = 440;
                        oscillator.type = 'sine';
                        gainNode.gain.value = 0.1;
                        break;
                    case 'powerup':
                        oscillator.frequency.value = 880;
                        oscillator.type = 'square';
                        gainNode.gain.value = 0.1;
                        break;
                    case 'hit':
                        oscillator.frequency.value = 110;
                        oscillator.type = 'sawtooth';
                        gainNode.gain.value = 0.15;
                        break;
                    case 'levelup':
                        oscillator.frequency.value = 660;
                        oscillator.type = 'triangle';
                        gainNode.gain.value = 0.12;
                        break;
                }
                
                oscillator.start();
                oscillator.stop(audioContext.currentTime + 0.15);
            } catch (e) {
                console.warn('Sound playback failed:', e);
            }
        }

        // Game Initialization
        function initGame() {
            setupCanvas();
            loadGameData();
            resetGame();
            gameLoop();
        }

        function setupCanvas() {
            const container = canvas.parentElement;
            const containerRect = container.getBoundingClientRect();
            
            // Responsive canvas sizing
            const maxWidth = containerRect.width - 40;
            const maxHeight = containerRect.height - 100;
            
            const scaleX = maxWidth / canvas.width;
            const scaleY = maxHeight / canvas.height;
            const baseScale = Math.min(scaleX, scaleY, 1);
            
            const finalScale = baseScale * gameState.zoomLevel;
            
            canvas.style.width = `${canvas.width * finalScale}px`;
            canvas.style.height = `${canvas.height * finalScale}px`;
        }

        // Game Loop
        let gameLoopId;
        function gameLoop() {
            if (gameState.isGameOver) return;
            
            if (!gameState.isPaused) {
                update();
                render();
            }
            
            gameLoopId = setTimeout(gameLoop, gameState.gameSpeed);
        }

        // Update game state
        function update() {
            gameState.frameCount++;
            
            if (gameState.autoplayEnabled) {
                autoPlay();
            }
            
            moveSnake();
            moveEnemies();
            
            if (gameState.boss) {
                moveBoss();
            }
            
            updateSpecialItems();
            updateParticles();
        }

        // Snake movement
        function moveSnake() {
            gameState.direction = gameState.nextDirection;
            
            const head = { ...gameState.snake[0] };
            
            switch (gameState.direction) {
                case 'up': head.y--; break;
                case 'down': head.y++; break;
                case 'left': head.x--; break;
                case 'right': head.x++; break;
            }
            
            // Wrap around edges
            if (head.x < 0) head.x = GRID_WIDTH - 1;
            if (head.x >= GRID_WIDTH) head.x = 0;
            if (head.y < 0) head.y = GRID_HEIGHT - 1;
            if (head.y >= GRID_HEIGHT) head.y = 0;
            
            // Check collisions
            if (checkCollision(head)) {
                handleCollision();
                return;
            }
            
            gameState.snake.unshift(head);
            
            // Check food
            if (head.x === gameState.food.x && head.y === gameState.food.y) {
                eatFood();
            } else {
                gameState.snake.pop();
            }
            
            checkSpecialItems(head);
        }

        function checkCollision(head) {
            // Self collision
            if (!powerUps.ghost) {
                for (let i = 1; i < gameState.snake.length; i++) {
                    if (gameState.snake[i].x === head.x && gameState.snake[i].y === head.y) {
                        return true;
                    }
                }
            }
            
            // Obstacle collision
            if (!powerUps.ghost) {
                for (const obstacle of gameState.obstacles) {
                    if (obstacle.x === head.x && obstacle.y === head.y) {
                        return true;
                    }
                }
            }
            
            // Enemy collision
            if (!powerUps.shield) {
                for (const enemy of gameState.enemies) {
                    if (enemy.x === head.x && enemy.y === head.y) {
                        return true;
                    }
                }
            }
            
            return false;
        }

        function handleCollision() {
            if (powerUps.shield) {
                powerUps.shield = false;
                showNotification('Kalkan Kullanıldı!');
                playSound('hit');
                return;
            }
            
            gameState.lives--;
            playSound('hit');
            
            // Add shake effect
            canvas.classList.add('game-over');
            setTimeout(() => canvas.classList.remove('game-over'), 500);
            
            if (gameState.lives <= 0) {
                gameOver();
            } else {
                resetSnake();
                showNotification(`Can: ${gameState.lives}`);
            }
            
            updateUI();
        }

        function eatFood() {
            const points = powerUps.double ? 20 : 10;
            gameState.score += points;
            
            playSound('eat');
            createParticles(gameState.food.x, gameState.food.y, '#ffd700');
            generateFood();
            
            // Chance for special item
            if (Math.random() < 0.5) {
                generateSpecialItem();
            }
            
            // Level up check
            if (gameState.score >= gameState.level * 100) {
                levelUp();
            }
            
            updateUI();
        }

        function levelUp() {
            gameState.level++;
            
            const levelData = levels[Math.min(gameState.level - 1, levels.length - 1)];
            
            // Add glow effect
            canvas.classList.add('level-up');
            setTimeout(() => canvas.classList.remove('level-up'), 1000);
            
            showNotification(`Level ${gameState.level}: ${levelData.name}`);
            
            gameState.theme = levelData.theme;
            
            // Apply speed mode to new level
            const speeds = {
                'slow': { multiplier: 1.5, name: 'Yavaş' },
                'normal': { multiplier: 1, name: 'Normal' },
                'fast': { multiplier: 0.7, name: 'Hızlı' }
            };
            gameState.gameSpeed = Math.floor(levelData.speed * speeds[gameState.speedMode].multiplier);
            
            generateObstacles(levelData.obstaclePattern);
            generateEnemies(levelData.enemyCount);
            
            if (levelData.boss) {
                generateBoss();
            }
            
            playSound('levelup');
        }

        // Simple AI for autoplay
        function autoPlay() {
            const head = gameState.snake[0];
            const food = gameState.food;
            
            let bestDirection = gameState.direction;
            let minDistance = Infinity;
            
            const directions = ['up', 'down', 'left', 'right'];
            const opposite = {
                'up': 'down', 'down': 'up',
                'left': 'right', 'right': 'left'
            };
            
            directions.forEach(dir => {
                if (dir === opposite[gameState.direction]) return;
                
                const newHead = getNewPosition(head, dir);
                if (isSafePosition(newHead)) {
                    const distance = Math.abs(newHead.x - food.x) + Math.abs(newHead.y - food.y);
                    if (distance < minDistance) {
                        minDistance = distance;
                        bestDirection = dir;
                    }
                }
            });
            
            gameState.nextDirection = bestDirection;
        }

        function getNewPosition(pos, direction) {
            const newPos = { ...pos };
            switch(direction) {
                case 'up': newPos.y--; break;
                case 'down': newPos.y++; break;
                case 'left': newPos.x--; break;
                case 'right': newPos.x++; break;
            }
            
            if (newPos.x < 0) newPos.x = GRID_WIDTH - 1;
            if (newPos.x >= GRID_WIDTH) newPos.x = 0;
            if (newPos.y < 0) newPos.y = GRID_HEIGHT - 1;
            if (newPos.y >= GRID_HEIGHT) newPos.y = 0;
            
            return newPos;
        }

        function isSafePosition(pos) {
            // Check snake body
            for (let i = 0; i < gameState.snake.length - 1; i++) {
                if (gameState.snake[i].x === pos.x && gameState.snake[i].y === pos.y) {
                    return false;
                }
            }
            
            // Check obstacles
            if (!powerUps.ghost) {
                for (const obstacle of gameState.obstacles) {
                    if (obstacle.x === pos.x && obstacle.y === pos.y) {
                        return false;
                    }
                }
            }
            
            return true;
        }

        // Enemy movement
        function moveEnemies() {
            if (powerUps.freeze || gameState.frameCount % 10 !== 0) return;
            
            gameState.enemies.forEach(enemy => {
                const head = gameState.snake[0];
                const dx = head.x - enemy.x;
                const dy = head.y - enemy.y;
                
                let newX = enemy.x;
                let newY = enemy.y;
                
                if (Math.abs(dx) > Math.abs(dy)) {
                    newX += dx > 0 ? 1 : -1;
                } else {
                    newY += dy > 0 ? 1 : -1;
                }
                
                if (newX >= 0 && newX < GRID_WIDTH && newY >= 0 && newY < GRID_HEIGHT) {
                    enemy.x = newX;
                    enemy.y = newY;
                }
            });
        }

        function moveBoss() {
            // Simple boss movement - implement as needed
        }

        // Generation functions
        function generateFood() {
            let x, y;
            do {
                x = Math.floor(Math.random() * GRID_WIDTH);
                y = Math.floor(Math.random() * GRID_HEIGHT);
            } while (isOccupied(x, y));
            
            gameState.food = { x, y };
        }

        function generateSpecialItem() {
            const types = ['coin', 'powerup', 'health', 'health']; // Health appears twice for higher chance
            const type = types[Math.floor(Math.random() * types.length)];
            
            let x, y;
            do {
                x = Math.floor(Math.random() * GRID_WIDTH);
                y = Math.floor(Math.random() * GRID_HEIGHT);
            } while (isOccupied(x, y));
            
            const item = { x, y, type, lifeTime: 300 }; // Increased lifetime
            
            if (type === 'powerup') {
                const powerTypes = Object.keys(powerUps);
                item.powerType = powerTypes[Math.floor(Math.random() * powerTypes.length)];
            }
            
            gameState.specialItems.push(item);
        }

        function generateObstacles(pattern) {
            gameState.obstacles = [];
            
            switch(pattern) {
                case 'simple':
                    for (let i = 0; i < 5; i++) {
                        let x, y;
                        do {
                            x = Math.floor(Math.random() * GRID_WIDTH);
                            y = Math.floor(Math.random() * GRID_HEIGHT);
                        } while (isOccupied(x, y) || isNearSnake(x, y));
                        gameState.obstacles.push({ x, y });
                    }
                    break;
                case 'walls':
                    for (let y = 5; y <= 8; y++) {
                        gameState.obstacles.push({ x: 8, y });
                        gameState.obstacles.push({ x: 21, y });
                    }
                    break;
                case 'corners':
                    const corners = [
                        { x: 3, y: 3 }, { x: 26, y: 3 },
                        { x: 3, y: 16 }, { x: 26, y: 16 }
                    ];
                    corners.forEach(pos => {
                        if (!isOccupied(pos.x, pos.y)) {
                            gameState.obstacles.push(pos);
                        }
                    });
                    break;
                case 'center':
                    const centerX = Math.floor(GRID_WIDTH / 2);
                    const centerY = Math.floor(GRID_HEIGHT / 2);
                    for (let x = centerX - 1; x <= centerX + 1; x++) {
                        for (let y = centerY - 1; y <= centerY + 1; y++) {
                            if (!isOccupied(x, y)) {
                                gameState.obstacles.push({ x, y });
                            }
                        }
                    }
                    break;
                case 'boss':
                    // Boss arena obstacles
                    for (let i = 0; i < GRID_WIDTH; i += 5) {
                        gameState.obstacles.push({ x: i, y: 2 });
                        gameState.obstacles.push({ x: i, y: GRID_HEIGHT - 3 });
                    }
                    break;
            }
        }

        function generateEnemies(count) {
            gameState.enemies = [];
            
            for (let i = 0; i < count; i++) {
                let x, y;
                do {
                    x = Math.floor(Math.random() * GRID_WIDTH);
                    y = Math.floor(Math.random() * GRID_HEIGHT);
                } while (isOccupied(x, y) || isNearSnake(x, y));
                
                gameState.enemies.push({ x, y });
            }
        }

        function generateBoss() {
            showNotification('BOSS GELİYOR!');
            // Boss implementation
        }

        function isOccupied(x, y) {
            // Check snake
            for (const segment of gameState.snake) {
                if (segment.x === x && segment.y === y) return true;
            }
            
            // Check obstacles
            for (const obstacle of gameState.obstacles) {
                if (obstacle.x === x && obstacle.y === y) return true;
            }
            
            // Check food
            if (gameState.food && gameState.food.x === x && gameState.food.y === y) return true;
            
            // Check enemies
            for (const enemy of gameState.enemies) {
                if (enemy.x === x && enemy.y === y) return true;
            }
            
            return false;
        }

        function isNearSnake(x, y) {
            const head = gameState.snake[0];
            return Math.abs(head.x - x) <= 2 && Math.abs(head.y - y) <= 2;
        }

        function checkSpecialItems(head) {
            gameState.specialItems = gameState.specialItems.filter(item => {
                if (item.x === head.x && item.y === head.y) {
                    collectSpecialItem(item);
                    return false;
                }
                return true;
            });
        }

        function collectSpecialItem(item) {
            playSound('powerup');
            
            switch(item.type) {
                case 'coin':
                    gameState.coins += 5;
                    showNotification('+5 💰');
                    break;
                case 'powerup':
                    inventory[item.powerType]++;
                    showNotification(`+1 ${getPowerUpName(item.powerType)}`);
                    break;
                case 'health':
                    if (gameState.lives < 5) {
                        gameState.lives++;
                        showNotification('❤️ +1 Can! ❤️');
                        createParticles(item.x, item.y, '#ff69b4'); // Pink particles for hearts
                        playSound('levelup'); // Different sound for health
                    } else {
                        showNotification('❤️ Max Can! +10 Puan');
                        gameState.score += 10; // Bonus if max health
                    }
                    break;
            }
            
            updateUI();
        }

        // Rendering
        function render() {
            // Clear canvas
            ctx.fillStyle = gameState.theme ? gameState.theme.bg : '#0a0a0a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Draw grid
            drawGrid();
            
            // Draw game objects
            drawObstacles();
            drawFood();
            drawSpecialItems();
            drawEnemies();
            drawSnake();
            drawParticles();
        }

        function drawGrid() {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.03)';
            ctx.lineWidth = 1;
            
            for (let i = 0; i <= GRID_WIDTH; i++) {
                ctx.beginPath();
                ctx.moveTo(i * CELL_SIZE, 0);
                ctx.lineTo(i * CELL_SIZE, canvas.height);
                ctx.stroke();
            }
            
            for (let j = 0; j <= GRID_HEIGHT; j++) {
                ctx.beginPath();
                ctx.moveTo(0, j * CELL_SIZE);
                ctx.lineTo(canvas.width, j * CELL_SIZE);
                ctx.stroke();
            }
        }

        function drawSnake() {
            gameState.snake.forEach((segment, index) => {
                ctx.save();
                
                if (powerUps.ghost) {
                    ctx.globalAlpha = 0.5;
                }
                
                // Gradient for snake
                const gradient = ctx.createLinearGradient(
                    segment.x * CELL_SIZE,
                    segment.y * CELL_SIZE,
                    (segment.x + 1) * CELL_SIZE,
                    (segment.y + 1) * CELL_SIZE
                );
                
                const baseColor = gameState.theme ? gameState.theme.snake : '#00ff88';
                gradient.addColorStop(0, baseColor);
                gradient.addColorStop(1, darkenColor(baseColor, 20));
                
                ctx.fillStyle = gradient;
                ctx.fillRect(
                    segment.x * CELL_SIZE + 1,
                    segment.y * CELL_SIZE + 1,
                    CELL_SIZE - 2,
                    CELL_SIZE - 2
                );
                
                // Draw eyes for head
                if (index === 0) {
                    ctx.fillStyle = 'white';
                    const eyeSize = 3;
                    const eyeOffset = 5;
                    
                    ctx.beginPath();
                    ctx.arc(
                        segment.x * CELL_SIZE + eyeOffset,
                        segment.y * CELL_SIZE + eyeOffset,
                        eyeSize, 0, Math.PI * 2
                    );
                    ctx.arc(
                        segment.x * CELL_SIZE + CELL_SIZE - eyeOffset,
                        segment.y * CELL_SIZE + eyeOffset,
                        eyeSize, 0, Math.PI * 2
                    );
                    ctx.fill();
                }
                
                // Shield effect
                if (powerUps.shield && index === 0) {
                    ctx.strokeStyle = 'rgba(0, 200, 255, 0.8)';
                    ctx.lineWidth = 3;
                    ctx.strokeRect(
                        segment.x * CELL_SIZE - 2,
                        segment.y * CELL_SIZE - 2,
                        CELL_SIZE + 4,
                        CELL_SIZE + 4
                    );
                }
                
                ctx.restore();
            });
        }

        function drawFood() {
            const x = gameState.food.x * CELL_SIZE + CELL_SIZE/2;
            const y = gameState.food.y * CELL_SIZE + CELL_SIZE/2;
            
            // Pulsing effect
            const pulse = Math.sin(gameState.frameCount * 0.1) * 2;
            
            ctx.fillStyle = gameState.theme ? gameState.theme.food : '#ff6b35';
            ctx.beginPath();
            ctx.arc(x, y, CELL_SIZE/2 - 2 + pulse, 0, Math.PI * 2);
            ctx.fill();
            
            // Highlight
            ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.beginPath();
            ctx.arc(x - 3, y - 3, 3, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawObstacles() {
            ctx.fillStyle = '#4a4a5a';
            
            gameState.obstacles.forEach(obstacle => {
                // 3D effect
                ctx.fillStyle = '#5a5a6a';
                ctx.fillRect(
                    obstacle.x * CELL_SIZE + 2,
                    obstacle.y * CELL_SIZE + 2,
                    CELL_SIZE - 2,
                    CELL_SIZE - 2
                );
                
                ctx.fillStyle = '#3a3a4a';
                ctx.fillRect(
                    obstacle.x * CELL_SIZE,
                    obstacle.y * CELL_SIZE,
                    CELL_SIZE - 2,
                    CELL_SIZE - 2
                );
            });
        }

        function drawSpecialItems() {
            gameState.specialItems = gameState.specialItems.filter(item => {
                item.lifeTime--;
                
                if (item.lifeTime <= 0) return false;
                
                const x = item.x * CELL_SIZE + CELL_SIZE/2;
                const y = item.y * CELL_SIZE + CELL_SIZE/2;
                const alpha = item.lifeTime < 50 ? item.lifeTime / 50 : 1;
                
                ctx.save();
                ctx.globalAlpha = alpha;
                ctx.translate(x, y);
                ctx.rotate(gameState.frameCount * 0.05);
                
                ctx.font = `${CELL_SIZE * 0.8}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                
                switch(item.type) {
                    case 'coin':
                        ctx.fillText('💰', 0, 0);
                        break;
                    case 'powerup':
                        const icons = {
                            shield: '🛡️', speed: '⚡', double: '💫',
                            ghost: '👻', freeze: '❄️'
                        };
                        ctx.fillText(icons[item.powerType], 0, 0);
                        break;
                    case 'health':
                        ctx.restore();
                        ctx.save();
                        ctx.globalAlpha = alpha;
                        ctx.translate(x, y);
                        // Larger pulsing heart
                        const heartPulse = 1 + Math.sin(gameState.frameCount * 0.2) * 0.3;
                        ctx.scale(heartPulse, heartPulse);
                        ctx.font = `${CELL_SIZE * 1.2}px Arial`;
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText('❤️', 0, 0);
                        break;
                }
                
                ctx.restore();
                return true;
            });
        }

        function drawEnemies() {
            gameState.enemies.forEach(enemy => {
                ctx.save();
                
                if (powerUps.freeze) {
                    ctx.globalAlpha = 0.5;
                }
                
                ctx.fillStyle = '#ff4757';
                ctx.fillRect(
                    enemy.x * CELL_SIZE + 2,
                    enemy.y * CELL_SIZE + 2,
                    CELL_SIZE - 4,
                    CELL_SIZE - 4
                );
                
                // Eyes
                ctx.fillStyle = 'white';
                ctx.beginPath();
                ctx.arc(
                    enemy.x * CELL_SIZE + CELL_SIZE/3,
                    enemy.y * CELL_SIZE + CELL_SIZE/3,
                    2, 0, Math.PI * 2
                );
                ctx.arc(
                    enemy.x * CELL_SIZE + 2*CELL_SIZE/3,
                    enemy.y * CELL_SIZE + CELL_SIZE/3,
                    2, 0, Math.PI * 2
                );
                ctx.fill();
                
                ctx.restore();
            });
        }

        function drawParticles() {
            gameState.particles = gameState.particles.filter(particle => {
                particle.life--;
                
                if (particle.life <= 0) return false;
                
                particle.x += particle.vx;
                particle.y += particle.vy;
                particle.vy += particle.gravity;
                
                ctx.save();
                ctx.globalAlpha = particle.life / particle.maxLife;
                ctx.fillStyle = particle.color;
                ctx.fillRect(particle.x, particle.y, particle.size, particle.size);
                ctx.restore();
                
                return true;
            });
        }

        function createParticles(x, y, color) {
            for (let i = 0; i < 8; i++) {
                gameState.particles.push({
                    x: x * CELL_SIZE + CELL_SIZE/2,
                    y: y * CELL_SIZE + CELL_SIZE/2,
                    vx: (Math.random() - 0.5) * 6,
                    vy: (Math.random() - 0.5) * 6,
                    gravity: 0.2,
                    color: color,
                    size: Math.random() * 4 + 2,
                    life: 30,
                    maxLife: 30
                });
            }
        }

        // Utility functions
        function darkenColor(color, percent) {
            const num = parseInt(color.replace("#", ""), 16);
            const amt = Math.round(2.55 * percent);
            const R = (num >> 16) - amt;
            const G = (num >> 8 & 0x00FF) - amt;
            const B = (num & 0x0000FF) - amt;
            
            return "#" + (0x1000000 + (R < 255 ? R < 1 ? 0 : R : 255) * 0x10000 +
                (G < 255 ? G < 1 ? 0 : G : 255) * 0x100 +
                (B < 255 ? B < 1 ? 0 : B : 255)).toString(16).slice(1);
        }

        function updateSpecialItems() {
            gameState.specialItems = gameState.specialItems.filter(item => {
                item.lifeTime--;
                return item.lifeTime > 0;
            });
        }

        function updateParticles() {
            gameState.particles = gameState.particles.filter(particle => {
                particle.life--;
                return particle.life > 0;
            });
        }

        // Game controls
        function changeDirection(dir) {
            if (gameState.isPaused || gameState.isGameOver) return;
            
            const opposite = {
                'up': 'down', 'down': 'up',
                'left': 'right', 'right': 'left'
            };
            
            if (gameState.snake.length > 1 && dir === opposite[gameState.direction]) {
                return;
            }
            
            gameState.nextDirection = dir;
        }

        function togglePause() {
            if (gameState.isGameOver) return;
            
            gameState.isPaused = !gameState.isPaused;
            
            document.getElementById('pauseText').textContent = 
                gameState.isPaused ? 'Devam Et' : 'Duraklat';
            document.getElementById('mobilePauseText').textContent = 
                gameState.isPaused ? 'Devam' : 'Duraklat';
        }

        function toggleAutoplay() {
            gameState.autoplayEnabled = !gameState.autoplayEnabled;
            
            document.getElementById('autoplayStatus').textContent = 
                `Oto: ${gameState.autoplayEnabled ? 'Açık' : 'Kapalı'}`;
                
            showNotification(`Otomatik Oynama ${gameState.autoplayEnabled ? 'Açık' : 'Kapalı'}`);
        }

        function toggleSound() {
            gameState.soundEnabled = !gameState.soundEnabled;
            
            // Initialize audio on first toggle if enabled
            if (gameState.soundEnabled && !audioInitialized) {
                initAudio();
            }
            
            document.getElementById('soundStatus').textContent = 
                `Ses: ${gameState.soundEnabled ? 'Açık' : 'Kapalı'}`;
                
            if (gameState.soundEnabled && audioContext && audioContext.state === 'suspended') {
                audioContext.resume().catch(e => {
                    console.warn('Could not resume audio context:', e);
                });
            }
        }

        function toggleTheme() {
            document.body.classList.toggle('light-theme');
        }

        function resetGame() {
            if (gameLoopId) {
                clearTimeout(gameLoopId);
            }
            
            gameState.reset();
            
            Object.keys(powerUps).forEach(key => powerUps[key] = false);
            
            generateFood();
            generateObstacles('simple');
            
            updateUI();
            
            document.getElementById('gameOverModal').style.display = 'none';
            
            gameLoop();
        }

        function resetSnake() {
            gameState.snake = [
                { x: Math.floor(GRID_WIDTH / 2), y: Math.floor(GRID_HEIGHT / 2) },
                { x: Math.floor(GRID_WIDTH / 2) - 1, y: Math.floor(GRID_HEIGHT / 2) },
                { x: Math.floor(GRID_WIDTH / 2) - 2, y: Math.floor(GRID_HEIGHT / 2) }
            ];
            gameState.direction = 'right';
            gameState.nextDirection = 'right';
            
            // Temporary ghost mode
            powerUps.ghost = true;
            setTimeout(() => powerUps.ghost = false, 3000);
        }

        function gameOver() {
            gameState.isGameOver = true;
            
            if (gameState.score > gameState.highScore) {
                gameState.highScore = gameState.score;
                localStorage.setItem('snakeHighScore', gameState.highScore);
            }
            
            const earnedCoins = Math.floor(gameState.score / 10) + gameState.level * 5;
            gameState.coins += earnedCoins;
            localStorage.setItem('snakeCoins', gameState.coins);
            
            document.getElementById('gameOverTitle').textContent = 
                gameState.score > gameState.highScore ? 'Yeni Rekor!' : 'Oyun Bitti!';
            document.getElementById('gameOverMessage').innerHTML = `
                <div style="text-align: center; margin: 20px 0;">
                    <p style="margin: 8px 0;"><strong>Skor:</strong> ${gameState.score}</p>
                    <p style="margin: 8px 0;"><strong>Level:</strong> ${gameState.level}</p>
                    <p style="margin: 8px 0;"><strong>Kazanılan Coin:</strong> ${earnedCoins}</p>
                    <p style="margin: 8px 0;"><strong>Toplam Coin:</strong> ${gameState.coins}</p>
                </div>
            `;
            document.getElementById('gameOverModal').style.display = 'flex';
            document.getElementById('gameOverModal').classList.add('show');
        }

        function useItem(type) {
            if (inventory[type] <= 0) {
                showNotification('Stokta yok!');
                return;
            }
            
            if (powerUps[type]) {
                showNotification('Zaten aktif!');
                return;
            }
            
            inventory[type]--;
            powerUps[type] = true;
            
            const duration = 30000; // 30 seconds
            
            if (type === 'speed') {
                gameState.gameSpeed = Math.max(80, gameState.gameSpeed - 40);
            }
            
            showNotification(`${getPowerUpName(type)} Aktif!`);
            
            setTimeout(() => {
                powerUps[type] = false;
                if (type === 'speed') {
                    const currentLevel = levels[Math.min(gameState.level - 1, levels.length - 1)];
                    gameState.gameSpeed = currentLevel.speed;
                }
                showNotification(`${getPowerUpName(type)} Bitti!`);
                updateUI();
            }, duration);
            
            updateUI();
        }

        function getPowerUpName(type) {
            const names = {
                shield: 'Kalkan', speed: 'Hız', double: 'Çift Puan',
                ghost: 'Hayalet', freeze: 'Dondurma'
            };
            return names[type];
        }

        function openShop() {
            gameState.isPaused = true;
            
            const shopGrid = document.getElementById('shopGrid');
            shopGrid.innerHTML = '';
            
            const items = [
                { id: 'shield', name: 'Kalkan', icon: '🛡️', desc: 'Bir darbe koruması', price: 0 },
                { id: 'speed', name: 'Hız', icon: '⚡', desc: 'Hız artışı', price: 0 },
                { id: 'double', name: 'Çift Puan', icon: '💫', desc: 'Çift puan kazanma', price: 0 },
                { id: 'ghost', name: 'Hayalet', icon: '👻', desc: 'Geçirgenlik', price: 0 },
                { id: 'freeze', name: 'Dondurma', icon: '❄️', desc: 'Düşman dondurma', price: 0 },
                { id: 'life', name: 'Ekstra Can', icon: '❤️', desc: '+1 Can (Max 5)', price: 0 }
            ];
            
            items.forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.className = 'shop-item';
                
                const isMaxLife = item.id === 'life' && gameState.lives >= 5;
                
                itemDiv.innerHTML = `
                    <div class="shop-item-icon">${item.icon}</div>
                    <div class="shop-item-title">${item.name}</div>
                    <div class="shop-item-desc">${item.desc}</div>
                    <div class="shop-item-price">ÜCRETSİZ 🎁</div>
                    <button class="btn btn-primary ripple" onclick="buyItem('${item.id}', ${item.price})" 
                            ${isMaxLife ? 'disabled' : ''}>
                        ${isMaxLife ? 'Max' : 'Al'}
                    </button>
                `;
                
                shopGrid.appendChild(itemDiv);
            });
            
            document.getElementById('shopModal').style.display = 'flex';
            document.getElementById('shopModal').classList.add('show');
        }

        function closeShop() {
            document.getElementById('shopModal').style.display = 'none';
            document.getElementById('shopModal').classList.remove('show');
            gameState.isPaused = false;
        }

        function closeGameOver() {
            document.getElementById('gameOverModal').style.display = 'none';
            document.getElementById('gameOverModal').classList.remove('show');
        }

        function buyItem(itemId, price) {
            switch(itemId) {
                case 'shield':
                case 'speed':
                case 'double':
                case 'ghost':
                case 'freeze':
                    inventory[itemId] += 10;
                    showNotification('✅ Başarıyla alındı!');
                    break;
                case 'life':
                    if (gameState.lives < 5) {
                        gameState.lives++;
                        showNotification('✅ Başarıyla alındı!');
                    }
                    break;
            }
            
            updateUI();
            openShop(); // Refresh shop
        }

        function updateUI() {
            // Update stats
            document.getElementById('score').textContent = gameState.score;
            document.getElementById('level').textContent = gameState.level;
            document.getElementById('coins').textContent = gameState.coins;
            document.getElementById('highScore').textContent = gameState.highScore;
            
            // Update progress bar
            const progress = (gameState.score % 100) / 100 * 100;
            document.getElementById('progressBar').style.width = progress + '%';
            
            // Update lives
            const livesContainer = document.getElementById('livesDisplay');
            livesContainer.innerHTML = '';
            for (let i = 0; i < 5; i++) {
                const heart = document.createElement('span');
                heart.className = 'heart';
                heart.textContent = '❤️';
                if (i >= gameState.lives) heart.classList.add('empty');
                livesContainer.appendChild(heart);
            }
            
            // Update inventory
            Object.keys(inventory).forEach(item => {
                const countEl = document.getElementById(`${item}Count`);
                if (countEl) {
                    countEl.textContent = inventory[item];
                    countEl.style.display = inventory[item] > 0 ? 'flex' : 'none';
                }
                
                const itemEl = document.querySelector(`[onclick="useItem('${item}')"]`);
                if (itemEl) {
                    if (powerUps[item]) {
                        itemEl.classList.add('active');
                    } else {
                        itemEl.classList.remove('active');
                    }
                }
            });
        }

        function showNotification(message) {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.classList.add('show');
            
            setTimeout(() => {
                notification.classList.remove('show');
                notification.classList.add('hide');
                setTimeout(() => {
                    notification.classList.remove('hide');
                }, 300);
            }, 2500);
        }

        function loadGameData() {
            const savedHighScore = localStorage.getItem('snakeHighScore');
            const savedCoins = localStorage.getItem('snakeCoins');
            
            if (savedHighScore) {
                gameState.highScore = parseInt(savedHighScore);
            }
            
            if (savedCoins) {
                gameState.coins = parseInt(savedCoins);
            }
        }

        // Keyboard controls
        document.addEventListener('keydown', (e) => {
            e.preventDefault();
            
            switch(e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    changeDirection('up');
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    changeDirection('down');
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    changeDirection('left');
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    changeDirection('right');
                    break;
                case ' ':
                    togglePause();
                    break;
                case '1':
                    useItem('shield');
                    break;
                case '2':
                    useItem('speed');
                    break;
                case '3':
                    useItem('double');
                    break;
                case '4':
                    useItem('ghost');
                    break;
                case '5':
                    useItem('freeze');
                    break;
            }
        });

        // Touch controls for mobile
        let touchStartX = null;
        let touchStartY = null;

        canvas.addEventListener('touchstart', (e) => {
            const touch = e.touches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;
            e.preventDefault();
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
        });

        canvas.addEventListener('touchend', (e) => {
            if (!touchStartX || !touchStartY) return;
            
            const touch = e.changedTouches[0];
            const diffX = touch.clientX - touchStartX;
            const diffY = touch.clientY - touchStartY;
            
            const minSwipeDistance = 30;
            
            if (Math.abs(diffX) > Math.abs(diffY)) {
                if (Math.abs(diffX) > minSwipeDistance) {
                    if (diffX > 0) {
                        changeDirection('right');
                    } else {
                        changeDirection('left');
                    }
                }
            } else {
                if (Math.abs(diffY) > minSwipeDistance) {
                    if (diffY > 0) {
                        changeDirection('down');
                    } else {
                        changeDirection('up');
                    }
                }
            }
            
            touchStartX = null;
            touchStartY = null;
            e.preventDefault();
        });

        // Window resize handler
        window.addEventListener('resize', () => {
            setupCanvas();
        });

        // Initialize game when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            initGame();
            
            // Initialize audio on first user interaction
            const startAudio = () => {
                if (!audioInitialized) {
                    initAudio();
                    if (audioContext && audioContext.state === 'suspended') {
                        audioContext.resume().catch(e => {
                            console.warn('Could not resume audio context:', e);
                        });
                    }
                }
                // Remove listeners after first interaction
                document.removeEventListener('click', startAudio);
                document.removeEventListener('keydown', startAudio);
                document.removeEventListener('touchstart', startAudio);
            };
            
            document.addEventListener('click', startAudio);
            document.addEventListener('keydown', startAudio);
            document.addEventListener('touchstart', startAudio);
        });

        // Prevent context menu on long press
        document.addEventListener('contextmenu', (e) => {
            e.preventDefault();
        });

        // Prevent zoom on double tap
        let lastTouchEnd = 0;
        document.addEventListener('touchend', (e) => {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, false);

        // Zoom functionality
        function zoomIn() {
            if (gameState.zoomLevel < 2) {
                gameState.zoomLevel += 0.2;
                updateCanvasZoom();
                showNotification('Büyütüldü 🔍');
            }
        }

        function zoomOut() {
            if (gameState.zoomLevel > 0.6) {
                gameState.zoomLevel -= 0.2;
                updateCanvasZoom();
                showNotification('Küçültüldü 🔍');
            }
        }

        function updateCanvasZoom() {
            const container = canvas.parentElement;
            const containerRect = container.getBoundingClientRect();
            
            const maxWidth = containerRect.width - 40;
            const maxHeight = containerRect.height - 100;
            
            const scaleX = maxWidth / canvas.width;
            const scaleY = maxHeight / canvas.height;
            const baseScale = Math.min(scaleX, scaleY, 1);
            
            const finalScale = baseScale * gameState.zoomLevel;
            
            canvas.style.width = `${canvas.width * finalScale}px`;
            canvas.style.height = `${canvas.height * finalScale}px`;
        }

        function changeGameSpeed() {
            const speeds = {
                'slow': { multiplier: 1.5, name: 'Yavaş' },
                'normal': { multiplier: 1, name: 'Normal' },
                'fast': { multiplier: 0.7, name: 'Hızlı' }
            };
            
            const modeOrder = ['slow', 'normal', 'fast'];
            const currentIndex = modeOrder.indexOf(gameState.speedMode);
            const nextIndex = (currentIndex + 1) % modeOrder.length;
            
            gameState.speedMode = modeOrder[nextIndex];
            
            // Update current level speed
            const currentLevel = levels[Math.min(gameState.level - 1, levels.length - 1)];
            const baseSpeed = currentLevel.speed;
            gameState.gameSpeed = Math.floor(baseSpeed * speeds[gameState.speedMode].multiplier);
            
            // Update UI
            document.getElementById('speedStatus').textContent = 
                `Hız: ${speeds[gameState.speedMode].name}`;
            
            showNotification(`Hız: ${speeds[gameState.speedMode].name} 🏃`);
        }

        function toggleMobileControls() {
            const controls = document.getElementById('mobileControls');
            const toggle = document.getElementById('mobileToggle');
            
            controls.classList.toggle('hidden');
            
            if (controls.classList.contains('hidden')) {
                toggle.textContent = '▲';
                showNotification('Kontroller gizlendi');
            } else {
                toggle.textContent = '▼';
                showNotification('Kontroller açıldı');
            }
        }
    </script>
</body>
</html>
