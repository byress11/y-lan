<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Yılan Oyunu</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐍</text></svg>">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-gradient: linear-gradient(135deg, #7f5af0 0%, #2cb67d 100%);
            --container-bg: rgba(255, 255, 255, 0.95);
            --text-color: #333;
            --canvas-bg: #e9ecef;
            --canvas-border: #7f5af0;
            --btn-gradient: linear-gradient(135deg, #7f5af0, #2cb67d);
            --btn-text: white;
            --shadow: rgba(0, 0, 0, 0.15);
            --card-bg: rgba(255, 255, 255, 0.1);
            --card-border: rgba(255, 255, 255, 0.2);
        }

        .dark-theme {
            --bg-gradient: linear-gradient(135deg, #2c2c3a 0%, #1c1c2a 100%);
            --container-bg: rgba(30, 30, 40, 0.95);
            --text-color: #e0e0e0;
            --canvas-bg: #242434;
            --shadow: rgba(0, 0, 0, 0.3);
            --card-bg: rgba(40, 40, 60, 0.2);
            --card-border: rgba(70, 70, 90, 0.3);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg-gradient);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: var(--text-color);
            transition: all 0.3s ease;
        }

        .game-container {
            background: var(--container-bg);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 15px 35px var(--shadow);
            max-width: 95vw;
            max-height: 95vh;
            backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            display: flex;
            gap: 20px;
        }

        .game-left {
            flex: 0 0 280px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .game-right {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 400px;
            max-height: 70vh; /* Yeni eklenen: Oyun alanını dikey olarak küçültmek için */
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            backdrop-filter: blur(5px);
            border: 1px solid var(--card-border);
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .score-board {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .score-item {
            background: var(--btn-gradient);
            color: var(--btn-text);
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            box-shadow: 0 2px 8px var(--shadow);
        }

        .score-item span {
            display: block;
            font-size: 1.2em;
            font-weight: 700;
            margin-top: 3px;
        }

        .lives {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .heart {
            color: #ff4757;
            font-size: 1.4em;
            transition: opacity 0.3s ease;
        }

        .heart.empty {
            opacity: 0.3;
        }

        canvas {
            border: 3px solid var(--canvas-border);
            border-radius: 8px;
            background: var(--canvas-bg);
            box-shadow: 0 10px 30px var(--shadow);
            display: block;
            margin: 0 auto;
            width: 100%;
            max-width: 100%;
            max-height: 60vh; /* Yeni eklenen: Canvas yüksekliğini sınırlıyorum */
        }

        .level-progress {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 10px;
            overflow: hidden;
            margin: 15px 0;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #4CAF50, #8BC34A);
            transition: width 0.3s ease;
            border-radius: 10px;
        }

        .game-menu {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 15px;
        }

        .btn {
            background: var(--btn-gradient);
            color: var(--btn-text);
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 8px var(--shadow);
            font-weight: 500;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px var(--shadow);
        }

        .btn:active {
            transform: translateY(0);
        }

        .controls {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 8px;
            width: 150px;
            height: 150px;
            margin: 0 auto;
        }

        .control-btn {
            background: var(--btn-gradient);
            border: none;
            border-radius: 12px;
            color: var(--btn-text);
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 2px 8px var(--shadow);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .control-btn:hover {
            transform: translateY(-2px);
        }

        .control-btn.up { grid-column: 2; grid-row: 1; }
        .control-btn.left { grid-column: 1; grid-row: 2; }
        .control-btn.right { grid-column: 3; grid-row: 2; }
        .control-btn.down { grid-column: 2; grid-row: 3; }
        .control-center { 
            grid-column: 2; 
            grid-row: 2; 
            border-radius: 50%; 
            background: linear-gradient(135deg, #ff9f43, #ff6b6b);
        }

        .inventory {
            text-align: center;
        }

        .inventory h3 {
            margin-bottom: 10px;
            font-size: 1rem;
        }

        .inventory-items {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .inventory-btn {
            width: 50px;
            height: 50px;
            border-radius: 8px;
            border: none;
            background: var(--btn-gradient);
            color: var(--btn-text);
            font-size: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
            position: relative;
        }

        .inventory-btn:hover {
            transform: translateY(-2px);
        }

        .inventory-btn::after {
            content: attr(data-count);
            position: absolute;
            top: -5px;
            right: -5px;
            background: #e74c3c;
            color: white;
            font-size: 12px;
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .inventory-btn[data-count]:not([data-count="0"])::after {
            opacity: 1;
        }

        .autoplay-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .switch {
            position: relative;
            width: 50px;
            height: 24px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: #ccc;
            transition: 0.4s;
            border-radius: 24px;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 4px;
            bottom: 4px;
            background-color: white;
            transition: 0.4s;
            border-radius: 50%;
        }

        input:checked + .slider {
            background: var(--btn-gradient);
        }

        input:checked + .slider:before {
            transform: translateX(26px);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: var(--container-bg);
            padding: 20px;
            border-radius: 15px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            color: var(--text-color);
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
        }

        .shop-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin: 20px 0;
        }

        /* Mobil modal optimizasyonları */
        @media screen and (max-width: 768px) {
            .modal-content {
                width: 95%;
                max-width: none;
                margin: 10px;
                padding: 15px;
                max-height: 85vh;
                border-radius: 10px;
            }

            .modal-content h2 {
                font-size: 1.5em;
                margin-bottom: 15px;
            }

            .shop-grid {
                grid-template-columns: 1fr;
                gap: 10px;
                margin: 15px 0;
            }

            .shop-item {
                padding: 15px;
                margin-bottom: 5px;
            }

            .shop-item h3 {
                font-size: 1.1em;
                margin-bottom: 8px;
            }

            .shop-item p {
                font-size: 0.9em;
                margin: 5px 0;
            }

            .buy-btn, .btn {
                padding: 12px 20px;
                font-size: 16px;
                margin: 8px 5px;
                min-height: 44px; /* Touch target minimum */
                border-radius: 8px;
            }

            /* Envanter modal için özel düzenlemeler */
            .inventory-items {
                justify-content: center;
                gap: 15px;
                flex-wrap: wrap;
                margin: 20px 0;
            }

            #modalInventory .inventory-btn {
                width: 60px;
                height: 60px;
                font-size: 24px;
                margin: 5px;
            }
        }

        @media screen and (max-width: 480px) {
            .modal-content {
                width: 98%;
                margin: 5px;
                padding: 12px;
                border-radius: 8px;
            }

            .shop-item {
                padding: 12px;
            }

            .buy-btn, .btn {
                padding: 10px 15px;
                font-size: 14px;
                margin: 5px 3px;
            }

            #modalInventory .inventory-btn {
                width: 50px;
                height: 50px;
                font-size: 20px;
            }
        }

        .shop-item {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            text-align: center;
            transition: transform 0.2s ease;
        }

        .shop-item:hover {
            transform: translateY(-5px);
        }

        .shop-item h3 {
            color: var(--canvas-border);
            margin-bottom: 10px;
        }

        .buy-btn {
            background: var(--btn-gradient);
            color: var(--btn-text);
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            margin-top: 10px;
            font-weight: 600;
        }

        .buy-btn:hover {
            transform: translateY(-2px);
        }

        .buy-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .theme-toggle {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.3);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 18px;
            cursor: pointer;
            z-index: 100;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        .theme-toggle:hover {
            background: rgba(0, 0, 0, 0.5);
            transform: scale(1.1);
        }

        .theme-toggle:active {
            transform: scale(0.95);
        }

        /* Mobil için özel optimizasyonlar */
        @media screen and (max-width: 768px) {
            .theme-toggle {
                top: 8px;
                right: 8px;
                width: 44px; /* Touch target minimum */
                height: 44px;
                font-size: 20px;
                background: rgba(0, 0, 0, 0.4);
            }

            /* Mobil scroll engellemesi */
            body.mobile-game {
                position: fixed;
                width: 100%;
                height: 100%;
                overflow: hidden;
                -webkit-overflow-scrolling: touch;
            }

            /* Mobil zoom engellemesi */
            .game-container * {
                -webkit-touch-callout: none;
                -webkit-user-select: none;
                -khtml-user-select: none;
                -moz-user-select: none;
                -ms-user-select: none;
                user-select: none;
                -webkit-tap-highlight-color: transparent;
            }

            /* Mobil inputlar için özel durum */
            input, button {
                -webkit-user-select: auto;
                -moz-user-select: auto;
                -ms-user-select: auto;
                user-select: auto;
            }

            /* Canvas touch optimizasyonu */
            canvas {
                touch-action: manipulation;
                -webkit-touch-callout: none;
                -webkit-user-select: none;
                user-select: none;
            }
        }

        /* Çok küçük ekranlar için ekstra optimizasyon */
        @media screen and (max-width: 320px) {
            .dpad {
                width: 110px;
                height: 110px;
                padding: 8px;
                gap: 6px;
            }

            .dpad-btn {
                font-size: 18px;
            }

            .action-btn {
                width: 55px;
                height: 55px;
            }

            .btn-icon {
                font-size: 16px;
            }

            .btn-label {
                font-size: 7px;
            }

            .mobile-controls {
                padding: 10px;
                min-height: 120px;
            }

            .game-right {
                margin-bottom: 130px;
            }

            .score-item {
                padding: 2px 1px;
                font-size: 0.6em;
            }

            .inventory-btn {
                width: 26px;
                height: 26px;
                font-size: 11px;
            }
        }

        .power-up-indicator {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 12px 25px;
            border-radius: 10px;
            font-weight: bold;
            display: none;
            z-index: 1001;
            animation: powerUpFade 2s ease-out forwards;
        }

        @keyframes powerUpFade {
            0% { opacity: 0; transform: translate(-50%, -20px); }
            20% { opacity: 1; transform: translate(-50%, 0); }
            80% { opacity: 1; transform: translate(-50%, 0); }
            100% { opacity: 0; transform: translate(-50%, -20px); }
        }

        /* Mobil Kontroller */
        .mobile-controls {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: linear-gradient(135deg, #222222 0%, #111111 100%);
            border-top: 3px solid #ff6b35;
            padding: 10px;
            min-height: 180px; /* 150px'den 180px'e artırıldı */
            z-index: 1000;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 -5px 20px rgba(0, 0, 0, 0.5);
        }

        .dpad {
            position: relative;
            width: 180px; /* 150px'den 180px'e artırıldı */
            height: 180px; /* 150px'den 180px'e artırıldı */
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 5px;
            background: #333333;
            border-radius: 10px;
            padding: 10px;
            border: 3px solid #888888;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8), 0 0 5px rgba(255, 255, 255, 0.2);
        }

        .dpad-btn {
            background: linear-gradient(to bottom, #777777, #444444);
            border: 2px solid #999999;
            border-radius: 5px;
            color: #ffffff;
            font-size: 28px; /* 24px'den 28px'e artırıldı */
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3), 0 2px 4px rgba(0, 0, 0, 0.5);
            text-shadow: 0 -1px 0 rgba(0, 0, 0, 0.7);
            transition: all 0.1s;
        }

        .dpad-btn:active {
            transform: translateY(2px);
            box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.5);
            background: linear-gradient(to bottom, #555555, #333333);
        }

        .dpad-btn.up {
            grid-area: 1 / 2 / 2 / 3;
            background: linear-gradient(to bottom, #ff4757, #c43636);
            border-color: #ff6b6b;
        }

        .dpad-btn.left {
            grid-area: 2 / 1 / 3 / 2;
            background: linear-gradient(to bottom, #3742fa, #2d3ad1);
            border-color: #5c69ff;
        }

        .dpad-btn.right {
            grid-area: 2 / 3 / 3 / 4;
            background: linear-gradient(to bottom, #ffa502, #e67e22);
            border-color: #ffbe76;
        }

        .dpad-btn.down {
            grid-area: 3 / 2 / 4 / 3;
            background: linear-gradient(to bottom, #a55eea, #8854d0);
            border-color: #cd84f1;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
        }

        .action-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border: 3px solid #888888;
            background: linear-gradient(to bottom, #777777, #444444);
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-weight: bold;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.3), 0 3px 5px rgba(0, 0, 0, 0.5);
            transition: all 0.1s;
        }

        .btn-icon {
            font-size: 20px;
            margin-bottom: 3px;
        }

        .btn-label {
            font-size: 9px;
            font-weight: bold;
            letter-spacing: 0.5px;
            opacity: 0.9;
        }

        .dpad-btn:active, .action-btn:active {
            transform: scale(0.9);
            box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        /* Mobil kontroller için özel touch olayları */
        .dpad-btn:hover, .action-btn:hover {
            transform: none; /* Mobilde hover kaldır */
        }

        /* Aktif durum animasyonu */
        .dpad-btn:active {
            background-size: 120%;
            box-shadow: inset 0 4px 8px rgba(0, 0, 0, 0.4);
        }

        .action-btn:active {
            background-size: 120%;
        }

        /* Responsive Design */
        @media screen and (max-width: 768px) {
            body {
                overflow: hidden;
                position: fixed;
                width: 100%;
                height: 100%;
                padding: 0;
                margin: 0;
            }

            .game-container {
                flex-direction: column;
                max-width: 100vw;
                max-height: 100vh;
                padding: 5px;
                border-radius: 0;
                height: 100vh;
                margin-bottom: 0;
                gap: 5px;
                border: none;
            }

            .game-left {
                flex: 0 0 auto;
                width: 100%;
                margin-bottom: 0;
                max-height: 25vh;
                overflow-y: auto;
                padding-bottom: 5px;
            }

            .game-right {
                flex: 1;
                width: 100%;
                min-width: 0;
                min-height: 0;
                margin-bottom: 250px; /* 220px'den 250px'e artırıldı */
                display: flex;
                flex-direction: column;
                max-height: 55vh; 
            }

            .game-menu {
                flex-wrap: nowrap;
                overflow-x: auto;
                gap: 5px;
                margin-bottom: 5px;
                padding: 5px 0;
            }

            .btn {
                padding: 8px 12px;
                font-size: 12px;
                white-space: nowrap;
                flex-shrink: 0;
            }

            .level-progress {
                margin: 5px 0;
                height: 6px;
            }

            .controls {
                display: none;
            }

            .mobile-controls {
                display: flex;
            }

            canvas {
                flex: 1;
                width: 100% !important;
                height: auto !important;
                max-height: calc(100vh - 460px) !important; /* 430px'den 460px'e artırıldı */
                min-height: 150px;
                border-width: 2px;
            }

            .score-board {
                grid-template-columns: repeat(4, 1fr);
                gap: 3px;
            }

            .score-item {
                padding: 6px 4px;
                font-size: 0.75em;
            }

            .score-item span {
                font-size: 1em;
                margin-top: 2px;
            }

            .inventory-items {
                gap: 5px;
                justify-content: space-around;
            }

            .inventory-btn {
                width: 35px;
                height: 35px;
                font-size: 14px;
                flex-shrink: 0;
            }

            .card {
                padding: 8px;
                margin-bottom: 3px;
            }

            .lives {
                gap: 4px;
            }

            .heart {
                font-size: 1.2em;
            }

            .autoplay-container {
                padding: 5px;
                gap: 8px;
            }

            .theme-toggle {
                top: 10px;
                right: 10px;
                width: 35px;
                height: 35px;
                font-size: 16px;
            }
        }

        @media screen and (max-width: 768px) and (orientation: landscape) {
            .game-container {
                flex-direction: row;
                margin-bottom: 0;
                gap: 5px;
            }

            .game-left {
                flex: 0 0 200px;
                width: 200px;
                max-height: 100vh;
                margin-bottom: 0;
                margin-right: 5px;
            }

            .game-right {
                flex: 1;
                width: auto;
                margin-bottom: 150px; /* Landscape kontroller için daha fazla boş alan */
                max-height: 60vh; /* Landscape için de yüksekliği sınırlıyorum */
            }

            canvas {
                max-height: calc(100vh - 200px) !important; /* Landscape için daha fazla boş alan */
                width: 100% !important;
            }

            .mobile-controls {
                min-height: 100px;
                padding: 10px;
            }

            .dpad {
                width: 90px;
                height: 90px;
            }

            .dpad-btn {
                font-size: 14px;
            }

            .action-btn {
                width: 45px;
                height: 45px;
            }

            .btn-icon {
                font-size: 14px;
            }

            .btn-label {

    <!-- Güç Artışı Göstergesi -->

    <script>
        // Oyun Değişkenleri
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        let cellSize = 20;
        let cols, rows;
        let snake = [];
        let direction = 'right';
        let nextDirection = 'right';
        let food = {};
        let specialItems = [];
        let obstacles = [];
        
        let score = 0;
        let level = 1;
        let coins = 100; // Başlangıç coin'i
        let lives = 3;
        let highScore = 0;
        let gameSpeed = 150;
        
        let isPaused = false;
        let soundEnabled = true;
        let autoplayEnabled = false;
        let rainbowMode = false;
        let snakeColor = '#4CAF50';
        let currentSkin = 'default';
        
        // Güç artışları
        let powerUps = {
            shield: false,
            speedBoost: false,
            doublePoints: false,
            ghostMode: false
        };
        
        let inventory = {
            shield: 5,
            speedBoost: 5,
            doublePoints: 5,
            ghostMode: 5
        };
        
        // Tema verileri
        const themes = [
            { name: 'Yeşil', bg: '#e9ecef', food: '#ff4757', snake: '#4CAF50' },
            { name: 'Çöl', bg: '#ffeaa7', food: '#e74c3c', snake: '#f39c12' },
            { name: 'Buz', bg: '#dff9fb', food: '#ff9ff3', snake: '#0abde3' },
            { name: 'Uzay', bg: '#130f40', food: '#7bed9f', snake: '#8e44ad' },
            { name: 'Neon', bg: '#000000', food: '#00ffff', snake: '#39ff14' }
        ];
        
        // Market verileri
        const shopItems = [
            { id: 'shield', name: 'Kalkan', desc: 'Bir darbeye karşı koruma', price: 0, type: 'item' },
            { id: 'speedBoost', name: 'Hız Artışı', desc: '1 dakika hızlanma', price: 0, type: 'item' },
            { id: 'doublePoints', name: 'Çift Puan', desc: '1 dakika çift puan', price: 0, type: 'item' },
            { id: 'ghostMode', name: 'Hayalet Modu', desc: '1 dakika geçirgenlik', price: 0, type: 'item' },
            { id: 'redSkin', name: 'Kırmızı Yılan', desc: 'Kırmızı görünüm', price: 0, type: 'skin', color: '#e74c3c' },
            { id: 'blueSkin', name: 'Mavi Yılan', desc: 'Mavi görünüm', price: 0, type: 'skin', color: '#3498db' },
            { id: 'rainbowSkin', name: 'Gökkuşağı Yılan', desc: 'Rengarenk görünüm', price: 0, type: 'skin', color: 'rainbow' }
        ];

        // Ses Sistemi
        let audioContext;
        const sounds = {
            eat: { freq: [523, 659], duration: 0.05, type: 'triangle' },
            gameOver: { freq: [200, 150, 100], duration: [0.1, 0.1, 0.2], type: 'sawtooth' },
            levelUp: { freq: [261, 329, 392, 523], duration: 0.05, type: 'sine' },
            powerUp: { freq: [440, 660, 880], duration: 0.05, type: 'square' }
        };

        function initAudio() {
            if (!audioContext && (window.AudioContext || window.webkitAudioContext)) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playSound(soundName) {
            if (!soundEnabled || !audioContext || !sounds[soundName]) return;
            
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }

            const sound = sounds[soundName];
            const frequencies = Array.isArray(sound.freq) ? sound.freq : [sound.freq];
            const durations = Array.isArray(sound.duration) ? sound.duration : [sound.duration];

            frequencies.forEach((freq, i) => {
                const osc = audioContext.createOscillator();
                const gainNode = audioContext.createGain();
                
                osc.connect(gainNode);
                gainNode.connect(audioContext.destination);
                
                osc.type = sound.type;
                osc.frequency.setValueAtTime(freq, audioContext.currentTime + i * 0.1);
                
                const duration = durations[i] || durations[0];
                const startTime = audioContext.currentTime + i * 0.1;
                
                gainNode.gain.setValueAtTime(0.1, startTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, startTime + duration);
                
                osc.start(startTime);
                osc.stop(startTime + duration);
            });
        }

        // Oyun Başlatma
        function initGame() {
            // Mobil optimizasyonları
            const isMobile = window.innerWidth <= 768;
            if (isMobile) {
                document.body.classList.add('mobile-game');
                
                // Mobil zoom engellemesi
                const viewport = document.querySelector('meta[name="viewport"]');
                if (viewport) {
                    viewport.setAttribute('content', 'width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no');
                }
                
                // Mobil scroll engellemesi
                document.addEventListener('touchmove', (e) => {
                    if (e.target.closest('.modal-content')) return; // Modal içinde kaydırmaya izin ver
                    e.preventDefault();
                }, { passive: false });
            }

            loadGameData();
            setupCanvas();
            resetGame();
            setupEventListeners();
            updateDisplays();
            gameLoop();
        }

        function setupCanvas() {
            const container = document.querySelector('.game-right');
            const isMobile = window.innerWidth <= 768;
            
            let availableWidth, availableHeight;
            
            if (isMobile) {
                // Mobil için özel hesaplama
                const isLandscape = window.innerWidth > window.innerHeight;
                
                if (isLandscape) {
                    // Landscape mode
                    availableWidth = container.clientWidth - 10;
                    availableHeight = window.innerHeight - 180; // Kontroller ve menü için yer
                } else {
                    // Portrait mode
                    const menuHeight = document.querySelector('.game-menu')?.offsetHeight || 50;
                    const progressHeight = document.querySelector('.level-progress')?.offsetHeight || 20;
                    availableWidth = container.clientWidth - 10;
                    availableHeight = window.innerHeight - menuHeight - progressHeight - 280; // Sol panel + kontroller için yer
                }
                
                // Mobil için daha büyük cell size
                cellSize = Math.min(
                    availableWidth / 25,  // Daha az sütun
                    availableHeight / 20  // Daha az satır
                );
                cellSize = Math.max(12, Math.min(cellSize, 20)); // Mobilde daha büyük minimum
                
            } else {
                // Masaüstü için orijinal hesaplama
                const menuHeight = 100;
                const progressHeight = 40;
                
                availableWidth = container.clientWidth - 20;
                availableHeight = container.clientHeight - menuHeight - progressHeight - 40;
                
                cellSize = Math.min(availableWidth / 30, availableHeight / 20);
                cellSize = Math.max(15, Math.min(cellSize, 25));
            }
            
            cols = Math.floor(availableWidth / cellSize);
            rows = Math.floor(availableHeight / cellSize);
            
            // Minimum boyutları garanti et
            cols = Math.max(15, cols);
            rows = Math.max(12, rows);
            
            canvas.width = cols * cellSize;
            canvas.height = rows * cellSize;
            
            // Canvas stil ayarları
            if (isMobile) {
                canvas.style.width = '100%';
                canvas.style.height = 'auto';
                canvas.style.maxWidth = '100%';
                canvas.style.maxHeight = availableHeight + 'px';
            }
        }

        function setupEventListeners() {
            document.addEventListener('keydown', handleKeyPress);
            window.addEventListener('resize', handleResize);
            window.addEventListener('orientationchange', handleOrientationChange);
            
            // Ses için ilk tıklama
            document.addEventListener('click', initAudio, { once: true });
            document.addEventListener('touchstart', initAudio, { once: true });
            
            // Mobil kontroller için özel touch olayları
            setupMobileControls();
        }

        function setupMobileControls() {
            // D-pad butonları için touch olayları
            const dpadButtons = document.querySelectorAll('.dpad-btn');
            dpadButtons.forEach(btn => {
                // Touch start
                btn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    
                    // Aktif görünüm
                    btn.style.transform = 'scale(0.9)';
                    btn.style.boxShadow = 'inset 0 4px 8px rgba(0, 0, 0, 0.4)';
                    
                    // Yön belirleme
                    if (btn.classList.contains('up')) changeDirection('up');
                    else if (btn.classList.contains('down')) changeDirection('down');
                    else if (btn.classList.contains('left')) changeDirection('left');
                    else if (btn.classList.contains('right')) changeDirection('right');
                }, { passive: false });
                
                // Touch end
                btn.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    // Normal görünüme dön
                    btn.style.transform = '';
                    btn.style.boxShadow = '';
                }, { passive: false });
                
                // Touch cancel
                btn.addEventListener('touchcancel', (e) => {
                    e.preventDefault();
                    btn.style.transform = '';
                    btn.style.boxShadow = '';
                }, { passive: false });
            });

            // Aksiyon butonları için touch olayları
            const actionButtons = document.querySelectorAll('.action-btn');
            actionButtons.forEach(btn => {
                btn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    
                    // Aktif görünüm
                    btn.style.transform = 'scale(0.9)';
                    
                    // Fonksiyon belirleme
                    if (btn.classList.contains('pause')) togglePause();
                    else if (btn.classList.contains('auto')) toggleAutoplayMobile();
                    else if (btn.classList.contains('menu')) openInventory();
                    else if (btn.classList.contains('shop')) openShop();
                }, { passive: false });
                
                btn.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    btn.style.transform = '';
                }, { passive: false });
                
                btn.addEventListener('touchcancel', (e) => {
                    e.preventDefault();
                    btn.style.transform = '';
                }, { passive: false });
            });
        }

        function handleResize() {
            setupCanvas();
            if (!isPaused && lives > 0) drawGame();
        }

        function handleOrientationChange() {
            setTimeout(() => {
                setupCanvas();
                if (!isPaused && lives > 0) drawGame();
            }, 200);
        }

        function handleMobileTouch(event, callback) {
            event.preventDefault();
            event.stopPropagation();
            
            // Görsel feedback
            const button = event.target;
            button.style.transform = 'scale(0.9)';
            
            // Fonksiyonu çalıştır
            if (callback) callback();
            
            // Görsel feedback'i geri al
            setTimeout(() => {
                button.style.transform = '';
            }, 150);
        }

        function handleKeyPress(e) {
            const keyMap = {
                'ArrowUp': 'up', 'KeyW': 'up',
                'ArrowDown': 'down', 'KeyS': 'down',
                'ArrowLeft': 'left', 'KeyA': 'left',
                'ArrowRight': 'right', 'KeyD': 'right',
                'Space': 'pause'
            };

            const action = keyMap[e.code];
            if (action) {
                e.preventDefault();
                if (action === 'pause') {
                    togglePause();
                } else {
                    changeDirection(action);
                }
            }

            // Envanter kısayolları
            if (e.code === 'Digit1') useItem('shield');
            if (e.code === 'Digit2') useItem('speedBoost');
            if (e.code === 'Digit3') useItem('doublePoints');
            if (e.code === 'Digit4') useItem('ghostMode');
            if (e.code === 'Digit5') changeSkin();
        }

        // Oyun Döngüsü
        function gameLoop() {
            if (isPaused || lives <= 0) return;
            
            moveSnake();
            drawGame();
            updateDisplays();
            
            setTimeout(gameLoop, gameSpeed);
        }

        function moveSnake() {
            if (autoplayEnabled) {
                autoMove();
            }

            direction = nextDirection;
            const head = { ...snake[0] };

            switch (direction) {
                case 'up': head.y--; break;
                case 'down': head.y++; break;
                case 'left': head.x--; break;
                case 'right': head.x++; break;
            }

            // Sınır kontrolü
            if (head.x < 0) head.x = cols - 1;
            if (head.x >= cols) head.x = 0;
            if (head.y < 0) head.y = rows - 1;
            if (head.y >= rows) head.y = 0;

            // Çarpışma kontrolü
            if (checkCollision(head)) return;

            snake.unshift(head);

            // Yemek kontrolü
            if (head.x === food.x && head.y === food.y) {
                eatFood();
            } else {
                snake.pop();
            }

            // Özel eşya kontrolü
            checkSpecialItems(head);
        }

        function checkCollision(head) {
            // Kendine çarpma
            if (!powerUps.ghostMode) {
                for (let i = 1; i < snake.length; i++) {
                    if (snake[i].x === head.x && snake[i].y === head.y) {
                        return handleDamage();
                    }
                }
            }

            // Engel çarpışması
            for (let obstacle of obstacles) {
                if (obstacle.x === head.x && obstacle.y === head.y) {
                    if (!powerUps.ghostMode) {
                        return handleDamage();
                    }
                }
            }

            return false;
        }

        function handleDamage() {
            if (powerUps.shield) {
                powerUps.shield = false;
                showPowerUpMessage('Kalkan Kullanıldı!');
                playSound('powerUp');
                return false;
            }

            lives--;
            playSound('gameOver');

            if (lives <= 0) {
                gameOver();
                return true;
            }

            // Yılanı küçült ve güvenli pozisyona al
            snake = [{ x: Math.floor(cols / 2), y: Math.floor(rows / 2) }];
            direction = 'right';
            nextDirection = 'right';
            
            // Geçici koruma - 5 saniye
            powerUps.ghostMode = true;
            setTimeout(() => { powerUps.ghostMode = false; }, 5000);
            
            showPowerUpMessage('Can Kaybı! Geçici koruma aktif.');
            return false;
        }

        function eatFood() {
            const points = powerUps.doublePoints ? 20 : 10;
            score += points;
            playSound('eat');
            
            generateFood();
            generateSpecialItem();
            
            if (score >= level * 100) {
                levelUp();
            }
        }

        function levelUp() {
            level++;
            playSound('levelUp');
            gameSpeed = Math.max(50, 150 - (level - 1) * 10);
            generateObstacles();
            showPowerUpMessage(`Level ${level}! Tema: ${themes[(level - 1) % themes.length].name}`);
            
            if (level % 3 === 0 && lives < 3) {
                lives++;
                showPowerUpMessage('+1 Can Bonusu!');
            }
        }

        function gameOver() {
            isPaused = true;
            const earnedCoins = Math.floor(score / 20);
            coins += earnedCoins;
            
            if (score > highScore) {
                highScore = score;
                showNotification('Yeni Rekor!', `Skorunuz: ${score}<br>Kazanılan Coin: ${earnedCoins}<br>Toplam Coin: ${coins}`);
            } else {
                showNotification('Oyun Bitti!', `Skorunuz: ${score}<br>Kazanılan Coin: ${earnedCoins}<br>Toplam Coin: ${coins}`);
            }
            
            saveGameData();
        }

        function resetGame() {
            snake = [{ x: Math.floor(cols / 2), y: Math.floor(rows / 2) }];
            direction = 'right';
            nextDirection = 'right';
            score = 0;
            level = 1;
            lives = 3;
            isPaused = false;
            gameSpeed = 150;
            
            // Güç artışlarını sıfırla
            Object.keys(powerUps).forEach(key => powerUps[key] = false);
            
            specialItems = [];
            generateFood();
            generateObstacles();
            updateDisplays();
        }

        // Çizim Fonksiyonları
        function drawGame() {
            const theme = themes[(level - 1) % themes.length];
            
            // Arkaplan
            ctx.fillStyle = theme.bg;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            // Grid
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.lineWidth = 1;
            for (let i = 1; i < cols; i++) {
                ctx.beginPath();
                ctx.moveTo(i * cellSize, 0);
                ctx.lineTo(i * cellSize, canvas.height);
                ctx.stroke();
            }
            for (let i = 1; i < rows; i++) {
                ctx.beginPath();
                ctx.moveTo(0, i * cellSize);
                ctx.lineTo(canvas.width, i * cellSize);
                ctx.stroke();
            }
            
            drawFood(theme);
            drawSpecialItems();
            drawObstacles();
            drawSnake(theme);
        }

        function drawFood(theme) {
            ctx.fillStyle = theme.food;
            ctx.beginPath();
            ctx.arc(
                food.x * cellSize + cellSize / 2,
                food.y * cellSize + cellSize / 2,
                cellSize / 2 - 2,
                0,
                Math.PI * 2
            );
            ctx.fill();
        }

        function drawSnake(theme) {
            const baseColor = rainbowMode ? null : (snakeColor || theme.snake);
            
            snake.forEach((segment, index) => {
                let color;
                if (rainbowMode) {
                    color = `hsl(${(index * 15 + Date.now() / 20) % 360}, 90%, 60%)`;
                } else {
                    const darkness = index * 5;
                    color = darkenColor(baseColor, darkness);
                }

                if (powerUps.ghostMode) {
                    ctx.globalAlpha = 0.6;
                }

                ctx.fillStyle = color;
                ctx.fillRect(
                    segment.x * cellSize,
                    segment.y * cellSize,
                    cellSize,
                    cellSize
                );

                ctx.strokeStyle = darkenColor(color, 20);
                ctx.strokeRect(
                    segment.x * cellSize,
                    segment.y * cellSize,
                    cellSize,
                    cellSize
                );

                ctx.globalAlpha = 1;
            });

            // Kalkan efekti
            if (powerUps.shield) {
                const head = snake[0];
                ctx.strokeStyle = 'rgba(0, 180, 255, 0.8)';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(
                    head.x * cellSize + cellSize / 2,
                    head.y * cellSize + cellSize / 2,
                    cellSize * 0.8,
                    0,
                    Math.PI * 2
                );
                ctx.stroke();
            }
        }

        function drawSpecialItems() {
            specialItems = specialItems.filter(item => {
                item.lifeTime--;
                if (item.lifeTime <= 0) return false;

                const opacity = item.lifeTime < 50 ? item.lifeTime / 50 : 1;
                let symbol = '?';
                let color = `rgba(255, 215, 0, ${opacity})`;

                switch (item.type) {
                    case 'coin': symbol = '💰'; break;
                    case 'powerFood': symbol = '🌟'; break;
                    case 'shield': symbol = '🛡️'; break;
                    case 'speed': symbol = '⚡'; break;
                }

                ctx.font = `${cellSize * 0.8}px Arial`;
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillStyle = color;
                ctx.fillText(
                    symbol,
                    item.x * cellSize + cellSize / 2,
                    item.y * cellSize + cellSize / 2
                );

                return true;
            });
        }

        function drawObstacles() {
            ctx.fillStyle = '#8B4513';
            obstacles.forEach(obstacle => {
                ctx.fillRect(
                    obstacle.x * cellSize,
                    obstacle.y * cellSize,
                    cellSize,
                    cellSize
                );
            });
        }

        // Üretim Fonksiyonları
        function generateFood() {
            let position;
            do {
                position = {
                    x: Math.floor(Math.random() * cols),
                    y: Math.floor(Math.random() * rows)
                };
            } while (
                snake.some(seg => seg.x === position.x && seg.y === position.y) ||
                obstacles.some(obs => obs.x === position.x && obs.y === position.y) ||
                specialItems.some(item => item.x === position.x && item.y === position.y)
            );
            food = position;
        }

        function generateSpecialItem() {
            if (Math.random() < 0.2) {
                const types = ['coin', 'powerFood', 'shield', 'speed'];
                let position;
                let attempts = 0;
                
                do {
                    position = {
                        x: Math.floor(Math.random() * cols),
                        y: Math.floor(Math.random() * rows)
                    };
                    attempts++;
                } while (
                    (snake.some(seg => seg.x === position.x && seg.y === position.y) ||
                    obstacles.some(obs => obs.x === position.x && obs.y === position.y) ||
                    specialItems.some(item => item.x === position.x && item.y === position.y) ||
                    (food.x === position.x && food.y === position.y)) && attempts < 50
                );

                if (attempts < 50) {
                    specialItems.push({
                        ...position,
                        type: types[Math.floor(Math.random() * types.length)],
                        lifeTime: 150
                    });
                }
            }
        }

        function generateObstacles() {
            obstacles = [];
            const count = Math.min(level * 2, Math.floor(cols * rows * 0.1));
            
            for (let i = 0; i < count; i++) {
                let position;
                let attempts = 0;
                
                do {
                    position = {
                        x: Math.floor(Math.random() * cols),
                        y: Math.floor(Math.random() * rows)
                    };
                    attempts++;
                } while (
                    (snake.some(seg => Math.abs(seg.x - position.x) < 3 && Math.abs(seg.y - position.y) < 3) ||
                    obstacles.some(obs => obs.x === position.x && obs.y === position.y) ||
                    (food.x === position.x && food.y === position.y)) && attempts < 50
                );

                if (attempts < 50) {
                    obstacles.push(position);
                }
            }
        }

        function checkSpecialItems(head) {
            specialItems.forEach((item, index) => {
                if (head.x === item.x && head.y === item.y) {
                    collectSpecialItem(item.type);
                    specialItems.splice(index, 1);
                }
            });
        }

        function collectSpecialItem(type) {
            switch (type) {
                case 'coin':
                    coins += level * 2;
                    showPowerUpMessage(`+${level * 2} Coin!`);
                    break;
                case 'powerFood':
                    score += powerUps.doublePoints ? 40 : 20;
                    showPowerUpMessage('+20 Puan!');
                    break;
                case 'shield':
                    inventory.shield++;
                    showPowerUpMessage('Kalkan Envantere Eklendi!');
                    break;
                case 'speed':
                    inventory.speedBoost++;
                    showPowerUpMessage('Hız Artışı Envantere Eklendi!');
                    break;
            }
            playSound('powerUp');
        }

        // Kontrol Fonksiyonları
        function changeDirection(newDir) {
            if (isPaused) return;
            
            const opposites = { 'up': 'down', 'down': 'up', 'left': 'right', 'right': 'left' };
            if (snake.length > 1 && opposites[newDir] === direction) return;
            
            nextDirection = newDir;
        }

        function togglePause() {
            if (lives <= 0) return;
            
            isPaused = !isPaused;
            document.getElementById('pauseText').textContent = isPaused ? 'Devam Et' : 'Duraklat';
            
            if (!isPaused) {
                gameLoop();
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            gameData.soundEnabled = soundEnabled;
            document.getElementById('soundStatus').textContent = soundEnabled ? 'Açık' : 'Kapalı';
        }

        function toggleAutoplay() {
            autoplayEnabled = document.getElementById('autoplayToggle').checked;
            showPowerUpMessage(`Oto-Oyna ${autoplayEnabled ? 'Aktif' : 'Devre Dışı'}`);
        }

        function toggleAutoplayMobile() {
            autoplayEnabled = !autoplayEnabled;
            document.getElementById('autoplayToggle').checked = autoplayEnabled;
            showPowerUpMessage(`Oto-Oyna ${autoplayEnabled ? 'Aktif' : 'Devre Dışı'}`);
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-theme');
            gameData.darkTheme = document.body.classList.contains('dark-theme');
            if (!isPaused) drawGame();
        }

        // Envanter ve Güç Artışları
        function useItem(itemType) {
            if (inventory[itemType] <= 0) {
                showPowerUpMessage(`${itemType} yok!`);
                return;
            }
            
            if (powerUps[itemType]) {
                showPowerUpMessage(`${itemType} zaten aktif!`);
                return;
            }

            // Güç artışını kullanma işlemi
            inventory[itemType]--;
            activatePowerUp(itemType);
            updateDisplays();
            saveGameData();
        }

        function activatePowerUp(type) {
            // Güç artışını aktifleştir
            powerUps[type] = true;
            playSound('powerUp');
            
            let duration = 60000; // 1 dakika = 60.000 ms
            let message = '';
            
            switch (type) {
                case 'shield':
                    message = 'Kalkan Aktif!';
                    duration = 0; // Kalkan bir darbeye kadar aktif
                    break;
                case 'speedBoost':
                    message = 'Hız Artışı Aktif!';
                    gameSpeed = Math.max(30, gameSpeed - 50);
                    break;
                case 'doublePoints':
                    message = 'Çift Puan Aktif!';
                    break;
                case 'ghostMode':
                    message = 'Hayalet Modu Aktif!';
                    break;
            }
            
            showPowerUpMessage(message);
            
            // Eğer bir süre limiti varsa
            if (duration > 0) {
                setTimeout(() => {
                    powerUps[type] = false;
                    if (type === 'speedBoost') {
                        gameSpeed = Math.max(50, 150 - (level - 1) * 10);
                    }
                    showPowerUpMessage(`${message.split(' ')[0]} Bitti!`);
                }, duration);
            }
        }

        function changeSkin() {
            const skins = ['default', 'red', 'blue', 'rainbow'];
            const colors = ['#4CAF50', '#e74c3c', '#3498db', 'rainbow'];
            
            let currentIndex = skins.findIndex(skin => {
                if (skin === 'rainbow') return rainbowMode;
                return snakeColor === colors[skins.indexOf(skin)];
            });
            
            currentIndex = (currentIndex + 1) % skins.length;
            const newSkin = skins[currentIndex];
            
            if (newSkin === 'rainbow') {
                rainbowMode = true;
                snakeColor = null;
                showPowerUpMessage('Gökkuşağı Yılan Aktif!');
            } else {
                rainbowMode = false;
                snakeColor = colors[currentIndex];
                showPowerUpMessage(`${newSkin.charAt(0).toUpperCase() + newSkin.slice(1)} Yılan Aktif!`);
            }
            
            currentSkin = newSkin;
            gameData.currentSkin = currentSkin;
        }

        // Oto-Oynatma
        function autoMove() {
            const head = snake[0];
            const moves = ['up', 'down', 'left', 'right'];
            const scores = [];

            moves.forEach(move => {
                const newHead = { ...head };
                switch (move) {
                    case 'up': newHead.y--; break;
                    case 'down': newHead.y++; break;
                    case 'left': newHead.x--; break;
                    case 'right': newHead.x++; break;
                }

                // Sınır kontrolü
                if (newHead.x < 0) newHead.x = cols - 1;
                if (newHead.x >= cols) newHead.x = 0;
                if (newHead.y < 0) newHead.y = rows - 1;
                if (newHead.y >= rows) newHead.y = 0;

                let score = 0;

                // Yemeğe olan mesafe
                const foodDistance = Math.abs(newHead.x - food.x) + Math.abs(newHead.y - food.y);
                score += 1000 / (foodDistance + 1);

                // Kendine çarpma kontrolü
                if (snake.some(seg => seg.x === newHead.x && seg.y === newHead.y)) {
                    score -= 10000;
                }

                // Engel kontrolü
                if (obstacles.some(obs => obs.x === newHead.x && obs.y === newHead.y)) {
                    score -= 5000;
                }

                // Zıt yön kontrolü
                const opposites = { 'up': 'down', 'down': 'up', 'left': 'right', 'right': 'left' };
                if (snake.length > 1 && opposites[move] === direction) {
                    score -= 50000;
                }

                scores.push({ move, score });
            });

            // En yüksek skora sahip hareketi seç
            scores.sort((a, b) => b.score - a.score);
            nextDirection = scores[0].move;
        }

        // UI Fonksiyonları
        function updateDisplays() {
            document.getElementById('score').textContent = score;
            document.getElementById('level').textContent = level;
            document.getElementById('coins').textContent = coins;
            document.getElementById('highScore').textContent = highScore;

            // İlerleme çubuğu
            const progress = (score % 100) / 100 * 100;
            document.getElementById('progressBar').style.width = progress + '%';

            // Canlar
            const livesContainer = document.getElementById('lives');
            livesContainer.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                const heart = document.createElement('span');
                heart.classList.add('heart');
                heart.innerHTML = '❤️';
                if (i >= lives) heart.classList.add('empty');
                livesContainer.appendChild(heart);
            }

            // Envanter
            const inventoryBtns = document.querySelectorAll('.inventory-btn');
            const items = ['shield', 'speedBoost', 'doublePoints', 'ghostMode'];
            items.forEach((item, index) => {
                if (inventoryBtns[index]) {
                    inventoryBtns[index].setAttribute('data-count', inventory[item]);
                }
            });
        }

        function showPowerUpMessage(message) {
            const indicator = document.getElementById('powerUpIndicator');
            indicator.textContent = message;
            indicator.style.display = 'block';
            indicator.style.animation = 'none';
            indicator.offsetHeight; // Reflow
            indicator.style.animation = 'powerUpFade 2s ease-out forwards';
        }

        function showNotification(title, message) {
            document.getElementById('notificationTitle').textContent = title;
            document.getElementById('notificationMessage').innerHTML = message;
            document.getElementById('notificationModal').style.display = 'flex';
        }

        function closeNotification() {
            document.getElementById('notificationModal').style.display = 'none';
            if (!isPaused && lives > 0) {
                gameLoop();
            }
        }

        // Market Fonksiyonları
        function openShop() {
            isPaused = true;
            populateShop();
            document.getElementById('shopModal').style.display = 'flex';
        }

        function closeShop() {
            document.getElementById('shopModal').style.display = 'none';
            isPaused = false;
            if (lives > 0) gameLoop();
        }

        function populateShop() {
            const shopGrid = document.getElementById('shopGrid');
            shopGrid.innerHTML = '';

            shopItems.forEach(item => {
                const itemDiv = document.createElement('div');
                itemDiv.classList.add('shop-item');
                itemDiv.innerHTML = `
                    <h3>${item.name}</h3>
                    <p>${item.desc}</p>
                    <p>Fiyat: ${item.price} Coin</p>
                    <button class="buy-btn" onclick="buyItem('${item.id}')">
                        ${item.price === 0 ? 'Ücretsiz Al' : 'Satın Al'}
                    </button>
                `;
                shopGrid.appendChild(itemDiv);
            });
        }

        function buyItem(itemId) {
            const item = shopItems.find(i => i.id === itemId);
            if (!item) return;

            if (item.type === 'item') {
                inventory[item.id] = (inventory[item.id] || 0) + 1;
                showPowerUpMessage(`✅ ${item.name}`);
            } else if (item.type === 'skin') {
                if (item.color === 'rainbow') {
                    rainbowMode = true;
                    snakeColor = null;
                } else {
                    rainbowMode = false;
                    snakeColor = item.color;
                }
                currentSkin = item.id;
                gameData.currentSkin = currentSkin;
                showPowerUpMessage(`✅ ${item.name}`);
            }

            updateDisplays();
            saveGameData();
            playSound('powerUp');
        }

        // Envanter Modal
        function openInventory() {
            isPaused = true;
            const modalInventory = document.getElementById('modalInventory');
            modalInventory.innerHTML = '';

            const items = [
                { key: 'shield', icon: '🛡️', name: 'Kalkan' },
                { key: 'speedBoost', icon: '⚡', name: 'Hız' },
                { key: 'doublePoints', icon: '💫', name: 'Çift Puan' },
                { key: 'ghostMode', icon: '👻', name: 'Hayalet' },
                { key: 'skin', icon: '🎨', name: 'Skin' }
            ];

            items.forEach(item => {
                const btn = document.createElement('button');
                btn.classList.add('inventory-btn');
                btn.innerHTML = item.icon;
                btn.title = item.name;
                
                if (item.key !== 'skin') {
                    // Güç artışının durumunu göster
                    btn.setAttribute('data-count', inventory[item.key]);
                    // Aktif olup olmadığını gösterecek şekilde stil ekle
                    if (powerUps[item.key]) {
                        btn.style.boxShadow = 'inset 0 0 10px rgba(0, 255, 0, 0.7)';
                    }
                    
                    btn.onclick = () => {
                        useItem(item.key);
                        // Modalı kapatmadan envanter sayısını güncelle
                        btn.setAttribute('data-count', inventory[item.key]);
                        // Aktifse stil ekle
                        if (powerUps[item.key]) {
                            btn.style.boxShadow = 'inset 0 0 10px rgba(0, 255, 0, 0.7)';
                        }
                        
                        // Tüm butonları güncellemek için envanter modalını yenile
                        updateInventoryModal();
                    };
                } else {
                    btn.onclick = () => {
                        changeSkin();
                    };
                }
                
                modalInventory.appendChild(btn);
            });

            document.getElementById('inventoryModal').style.display = 'flex';
        }
        
        // Envanter modalını güncelle
        function updateInventoryModal() {
            const modalInventory = document.getElementById('modalInventory');
            const buttons = modalInventory.querySelectorAll('.inventory-btn');
            
            const items = ['shield', 'speedBoost', 'doublePoints', 'ghostMode'];
            
            items.forEach((item, index) => {
                if (buttons[index]) {
                    buttons[index].setAttribute('data-count', inventory[item]);
                    if (powerUps[item]) {
                        buttons[index].style.boxShadow = 'inset 0 0 10px rgba(0, 255, 0, 0.7)';
                    } else {
                        buttons[index].style.boxShadow = '';
                    }
                }
            });
        }

        function closeInventory() {
            document.getElementById('inventoryModal').style.display = 'none';
            isPaused = false;
            if (lives > 0) gameLoop();
        }

        // Kayıt ve Yükleme
        // Oyun verilerini bellekte saklama (localStorage yerine)
        let gameData = {
            highScore: 0,
            coins: 100, // Başlangıç coin'i
            soundEnabled: true,
            darkTheme: false,
            currentSkin: 'default',
            inventory: {
                shield: 5,
                speedBoost: 5,
                doublePoints: 5,
                ghostMode: 5
            }
        };

        function saveGameData() {
            // Artifact ortamında localStorage desteklenmediği için
            // veriler sadece session boyunca bellekte saklanıyor
            gameData.highScore = Math.max(gameData.highScore, highScore);
            gameData.coins = coins;
            gameData.currentSkin = currentSkin;
            gameData.inventory = { ...inventory };
            gameData.soundEnabled = soundEnabled;
            gameData.darkTheme = document.body.classList.contains('dark-theme');
        }

        function loadGameData() {
            // Bellekteki verileri yükle
            highScore = gameData.highScore;
            coins = gameData.coins;
            soundEnabled = gameData.soundEnabled;
            currentSkin = gameData.currentSkin;
            inventory = { ...gameData.inventory };
            
            // Tema ayarları
            if (gameData.darkTheme) {
                document.body.classList.add('dark-theme');
            }

            // Skin ayarlarını uygula
            if (currentSkin === 'rainbow') {
                rainbowMode = true;
                snakeColor = null;
            } else {
                const skinItem = shopItems.find(item => item.id === currentSkin);
                if (skinItem && skinItem.color) {
                    snakeColor = skinItem.color;
                    rainbowMode = false;
                }
            }
        }

        // Yardımcı Fonksiyonlar
        function darkenColor(hex, percent) {
            if (!hex || hex === 'rainbow') return '#000000';
            
            const num = parseInt(hex.replace("#", ""), 16);
            const amt = Math.round(2.55 * percent);
            const R = (num >> 16) - amt;
            const G = (num >> 8 & 0x00FF) - amt;
            const B = (num & 0x0000FF) - amt;
            
            return "#" + (0x1000000 + (R < 255 ? R < 1 ? 0 : R : 255) * 0x10000 +
                (G < 255 ? G < 1 ? 0 : G : 255) * 0x100 +
                (B < 255 ? B < 1 ? 0 : B : 255)).toString(16).slice(1);
        }

        // Oyunu Başlat
        document.addEventListener('DOMContentLoaded', initGame);

        // Menü toggle
        document.addEventListener('DOMContentLoaded', function() {
            const menuToggleBtn = document.getElementById('menuToggle');
            if (menuToggleBtn) {
                menuToggleBtn.addEventListener('click', function() {
                    const menu = document.querySelector('.game-menu');
                    if (menu) menu.classList.toggle('show');
                });
            }
        });
    </script>
</body>
</html>
