        }
        
        // Yılan Sıfırlama
        function resetSnake() {
            gameState.snake = [
                { x: Math.floor(GRID_WIDTH / 2), y: Math.floor(GRID_HEIGHT / 2) },
                { x: Math.floor(GRID_WIDTH / 2) - 1, y: Math.floor(GRID_HEIGHT / 2) },
                { x: Math.floor(GRID_WIDTH / 2) - 2, y: Math.floor(GRID_HEIGHT / 2) }
            ];
            gameState.direction = 'right';
            gameState.nextDirection = 'right';
            
            // Geçici koruma
            powerUps.ghost = true;
            setTimeout(() => powerUps.ghost = false, 3000);
        }
        
        // Oyun Bitti
        function gameOver() {
            gameState.isGameOver = true;
            
            // Yüksek skor kontrolü
            if (gameState.score > gameState.highScore) {
                gameState.highScore = gameState.score;
                localStorage.setItem('snakeHighScore', gameState.highScore);
            }
            
            // Kazanılan coin hesapla
            const earnedCoins = Math.floor(gameState.score / 10) + gameState.level * 5;
            gameState.coins += earnedCoins;
            localStorage.setItem('snakeCoins', gameState.coins);
            
            // Modal göster
            document.getElementById('gameOverTitle').textContent = 
                gameState.score > gameState.highScore ? 'Yeni Rekor!' : 'Oyun Bitti!';
            document.getElementById('gameOverMessage').innerHTML = `
                <p>Skor: <strong>${gameState.score}</strong></p>
                <p>Level: <strong>${gameState.level}</strong></p>
                <p>Kazanılan Coin: <strong>${earnedCoins}</strong></p>
                <p>Toplam Coin: <strong>${gameState.coins}</strong></p>
            `;
            document.getElementById('gameOverModal').style.display = 'flex';
        }
        
        // Kontroller
        function changeDirection(dir) {
            if (gameState.isPaused || gameState.isGameOver) return;
            
            const opposite = {
                'up': 'down',
                'down': 'up',
                'left': 'right',
                'right': 'left'
            };
            
            if (gameState.snake.length > 1 && dir === opposite[gameState.direction]) {
                return;
            }
            
            gameState.nextDirection = dir;
        }
        
        // Klavye Kontrolleri
        document.addEventListener('keydown', (e) => {
            switch(e.key) {
                case 'ArrowUp':
                case 'w':
                case 'W':
                    changeDirection('up');
                    break;
                case 'ArrowDown':
                case 's':
                case 'S':
                    changeDirection('down');
                    break;
                case 'ArrowLeft':
                case 'a':
                case 'A':
                    changeDirection('left');
                    break;
                case 'ArrowRight':
                case 'd':
                case 'D':
                    changeDirection('right');
                    break;
                case ' ':
                    togglePause();
                    break;
                case '1':
                    useItem('shield');
                    break;
                case '2':
                    useItem('speed');
                    break;
                case '3':
                    useItem('double');
                    break;
                case '4':
                    useItem('ghost');
                    break;
                case '5':
                    useItem('freeze');
                    break;
            }
        });
        
        // Duraklatma - Mobil desteği eklenmiş
        function togglePause() {
            if (gameState.isGameOver) return;
            
            gameState.isPaused = !gameState.isPaused;
            
            // Masaüstü
            document.getElementById('pauseText').textContent = 
                gameState.isPaused ? 'Devam Et' : 'Duraklat';
            
            // Mobil
            document.getElementById('mobilePauseText').textContent = 
                gameState.isPaused ? 'Devam' : 'Duraklat';
        }

                case 'double':
                case 'ghost':
                case 'freeze':

                case 'life':

                case 'rainbow':
                case 'fire':
                case 'ice':
                case 'gold':

                    showPowerUp('✅ Alındı!');
                    break;
            }
            
            updateUI();
            
            // Market sayfasını güncelle

            gameState.specialItems = gameState.specialItems.filter(item => {
                item.lifeTime--;

            });

        function updateParticles() {
            gameState.particles = gameState.particles.filter(particle => {
                particle.life--;

        }
        
        // Renk Tonu Değiştirme
        function shadeColor(color, percent) {
            if (color === 'rainbow') return '#FF00FF';
            
            const num = parseInt(color.replace("#", ""), 16);
            const amt = Math.round(2.55 * percent);
            const R = (num >> 16) + amt;
            const G = (num >> 8 & 0x00FF) + amt;
            const B = (num & 0x0000FF) + amt;
            
            return "#" + (0x1000000 + (R < 255 ? R < 1 ? 0 : R : 255) * 0x10000 +
                (G < 255 ? G < 1 ? 0 : G : 255) * 0x100 +
                (B < 255 ? B < 1 ? 0 : B : 255)).toString(16).slice(1);
        }
        
        // LocalStorage'dan veri yükleme
        function loadGameData() {
            const savedHighScore = localStorage.getItem('snakeHighScore');
            const savedCoins = localStorage.getItem('snakeCoins');
            
            if (savedHighScore) {
                gameState.highScore = parseInt(savedHighScore);
            }
            
            if (savedCoins) {
                gameState.coins = parseInt(savedCoins);
            }
        }
        
        // Mobil kontrol optimizasyonu
        function setupMobileControls() {
            const isMobile = window.innerWidth <= 768;
            
            if (isMobile) {
                document.querySelector('.mobile-controls').style.display = 'flex';
                
                // Touch olayları için optimize edilmiş kontroller
                let touchStartX = null;
                let touchStartY = null;
                
                canvas.addEventListener('touchstart', (e) => {
                    const touch = e.touches[0];
                    touchStartX = touch.clientX;
                    touchStartY = touch.clientY;
                    e.preventDefault();
                });
                
                canvas.addEventListener('touchmove', (e) => {
                    if (!touchStartX || !touchStartY) return;
                    
                    const touch = e.touches[0];
                    const diffX = touch.clientX - touchStartX;
                    const diffY = touch.clientY - touchStartY;
                    
                    if (Math.abs(diffX) > Math.abs(diffY)) {
                        if (diffX > 50) {
                            changeDirection('right');
                        } else if (diffX < -50) {
                            changeDirection('left');
                        }
                    } else {
                        if (diffY > 50) {
                            changeDirection('down');
                        } else if (diffY < -50) {
                            changeDirection('up');
                        }
                    }
                    
                    touchStartX = null;
                    touchStartY = null;
                    e.preventDefault();
                });
            }
        }
        
        // Oyun başlatma
        window.onload = () => {

        };
        
        // Basit Engeller (sadece birkaç tane)
        function generateSimpleObstacles() {
            // Sadece 3-4 rastgele engel
            for (let i = 0; i < 4; i++) {
                let x, y;
                do {
                    x = Math.floor(Math.random() * GRID_WIDTH);
                    y = Math.floor(Math.random() * GRID_HEIGHT);
                } while (isOccupied(x, y) || (x >= 12 && x <= 17 && y >= 8 && y <= 11)); // Merkezi boş bırak
                
                gameState.obstacles.push({x, y});
            }
        }
        
        // Basit Duvarlar
        function generateWallObstacles() {
            // Sadece iki kısa dikey duvar
            for (let y = 6; y <= 9; y++) {
                if (!isOccupied(8, y)) gameState.obstacles.push({x: 8, y});
                if (!isOccupied(21, y)) gameState.obstacles.push({x: 21, y});
            }
        }
        
        // Köşe Engelleri
        function generateCornerObstacles() {
            // Sadece köşelerde küçük bloklar
            const corners = [
                {x: 2, y: 2}, {x: 3, y: 2}, {x: 2, y: 3},
                {x: GRID_WIDTH-3, y: 2}, {x: GRID_WIDTH-4, y: 2}, {x: GRID_WIDTH-3, y: 3},
                {x: 2, y: GRID_HEIGHT-3}, {x: 3, y: GRID_HEIGHT-3}, {x: 2, y: GRID_HEIGHT-4},
                {x: GRID_WIDTH-3, y: GRID_HEIGHT-3}, {x: GRID_WIDTH-4, y: GRID_HEIGHT-3}, {x: GRID_WIDTH-3, y: GRID_HEIGHT-4}
            ];
            
            corners.forEach(pos => {
                if (!isOccupied(pos.x, pos.y)) {
                    gameState.obstacles.push(pos);
                }
            });
        }
        
        // Merkez Blok
        function generateCenterObstacles() {
            // Sadece ortada 3x3 blok
            const centerX = Math.floor(GRID_WIDTH / 2);
            const centerY = Math.floor(GRID_HEIGHT / 2);
            
            for (let x = centerX - 1; x <= centerX + 1; x++) {
                for (let y = centerY - 1; y <= centerY + 1; y++) {
                    if (!isOccupied(x, y)) {
                        gameState.obstacles.push({x, y});
                    }
                }
            }
        }
        
        // Boss için Basit Arena
        function generateBossSimple() {
            // Sadece köşelerde küçük engeller
            const positions = [
                {x: 5, y: 5}, {x: 6, y: 5}, {x: 5, y: 6},
                {x: GRID_WIDTH-6, y: 5}, {x: GRID_WIDTH-7, y: 5}, {x: GRID_WIDTH-6, y: 6},
                {x: 5, y: GRID_HEIGHT-6}, {x: 6, y: GRID_HEIGHT-6}, {x: 5, y: GRID_HEIGHT-7},
                {x: GRID_WIDTH-6, y: GRID_HEIGHT-6}, {x: GRID_WIDTH-7, y: GRID_HEIGHT-6}, {x: GRID_WIDTH-6, y: GRID_HEIGHT-7}
            ];
            
            positions.forEach(pos => {
                if (!isOccupied(pos.x, pos.y)) {
                    gameState.obstacles.push(pos);
                }
            });
        }
        
        // Çifte Duvarlar
        function generateDoubleWalls() {
            // Üst ve alt yatay duvarlar
            for (let x = 5; x <= 10; x++) {
                if (!isOccupied(x, 4)) gameState.obstacles.push({x, y: 4});
                if (!isOccupied(x, 15)) gameState.obstacles.push({x, y: 15});
            }
            for (let x = 19; x <= 24; x++) {
                if (!isOccupied(x, 4)) gameState.obstacles.push({x, y: 4});
                if (!isOccupied(x, 15)) gameState.obstacles.push({x, y: 15});
            }
        }
        
        // Zigzag Engeller
        function generateZigzagObstacles() {
            // Zigzag desen
            for (let x = 3; x < GRID_WIDTH - 3; x += 3) {
                const y = (x / 3) % 2 === 0 ? 7 : 12;
                if (!isOccupied(x, y)) gameState.obstacles.push({x, y});
                if (!isOccupied(x + 1, y)) gameState.obstacles.push({x: x + 1, y});
            }
        }
        
        // Çember Engel
        function generateCircleObstacles() {
            const centerX = Math.floor(GRID_WIDTH / 2);
            const centerY = Math.floor(GRID_HEIGHT / 2);
            const radius = 4;
            
            for (let angle = 0; angle < 360; angle += 45) {
                const x = centerX + Math.round(radius * Math.cos(angle * Math.PI / 180));
                const y = centerY + Math.round(radius * Math.sin(angle * Math.PI / 180));
                if (x >= 0 && x < GRID_WIDTH && y >= 0 && y < GRID_HEIGHT && !isOccupied(x, y)) {
                    gameState.obstacles.push({x, y});
                }
            }
        }
        
        // Koridor
        function generateCorridorObstacles() {
            // Yatay koridor duvarları
            for (let x = 0; x < GRID_WIDTH; x++) {
                if (x < 8 || x > 21) {
                    if (!isOccupied(x, 7)) gameState.obstacles.push({x, y: 7});
                    if (!isOccupied(x, 12)) gameState.obstacles.push({x, y: 12});
                }
            }
        }
        
        // Kross (Artı Şekli)
        function generateCrossObstacles() {
            const centerX = Math.floor(GRID_WIDTH / 2);
            const centerY = Math.floor(GRID_HEIGHT / 2);
            
            // Dikey çizgi
            for (let y = centerY - 3; y <= centerY + 3; y++) {
                if (!isOccupied(centerX, y)) gameState.obstacles.push({x: centerX, y});
            }
            // Yatay çizgi
            for (let x = centerX - 4; x <= centerX + 4; x++) {
                if (!isOccupied(x, centerY)) gameState.obstacles.push({x, y: centerY});
            }
        }
        
        // Mini Labirent
        function generateMiniMaze() {

                {x: 20, y: 5}, {x: 21, y: 5}, {x: 22, y: 5},
                {x: 20, y: 6}, {x: 20, y: 7}, {x: 20, y: 8}

            walls.forEach(pos => {
                if (!isOccupied(pos.x, pos.y)) {

        // Diagonal Engeller
        function generateDiagonalObstacles() {
            // Çapraz çizgiler
            for (let i = 0; i < 8; i++) {
                const x1 = 5 + i;
                const y1 = 5 + i;
                const x2 = GRID_WIDTH - 6 - i;
                const y2 = 5 + i;
                
                if (!isOccupied(x1, y1)) gameState.obstacles.push({x: x1, y: y1});
                if (!isOccupied(x2, y2)) gameState.obstacles.push({x: x2, y: y2});

        // Çoklu Bloklar
        function generateMultiBlocks() {
            const blocks = [
                // Sol üst blok
                {x: 4, y: 4}, {x: 5, y: 4}, {x: 4, y: 5}, {x: 5, y: 5},
                // Sağ üst blok

        // Spiral
        function generateSpiralObstacles() {
            const centerX = Math.floor(GRID_WIDTH / 2);
            const centerY = Math.floor(GRID_HEIGHT / 2);
            
            // Spiral desen
            const spiralPoints = [
                {x: centerX, y: centerY - 1},
                {x: centerX + 1, y: centerY - 1},
                {x: centerX + 1, y: centerY},
                {x: centerX + 1, y: centerY + 1},
                {x: centerX, y: centerY + 1},
                {x: centerX - 1, y: centerY + 1},
                {x: centerX - 1, y: centerY},
                {x: centerX - 1, y: centerY - 1},
                {x: centerX - 1, y: centerY - 2},
                {x: centerX, y: centerY - 2},
                {x: centerX + 1, y: centerY - 2},
                {x: centerX + 2, y: centerY - 2},
                {x: centerX + 2, y: centerY - 1},
                {x: centerX + 2, y: centerY},
                {x: centerX + 2, y: centerY + 1},
                {x: centerX + 2, y: centerY + 2}
            ];
            
            spiralPoints.forEach(pos => {
                if (!isOccupied(pos.x, pos.y)) {
                    gameState.obstacles.push(pos);
                }
            });
        }
        
        // Karmaşık Desen
        function generateComplexObstacles() {
            // Birden fazla deseni birleştir
            generateCornerObstacles();
            generateCrossObstacles();
            
            // Ek rastgele engeller
            for (let i = 0; i < 6; i++) {

        // Nihai Boss Arena
        function generateFinalBossArena() {
            // Gelişmiş boss arenası
            for (let i = 0; i < GRID_WIDTH; i += 3) {
                if (!isOccupied(i, 2)) gameState.obstacles.push({x: i, y: 2});
                if (!isOccupied(i, GRID_HEIGHT - 3)) gameState.obstacles.push({x: i, y: GRID_HEIGHT - 3});
            }
            
            for (let j = 2; j < GRID_HEIGHT - 2; j += 3) {
                if (!isOccupied(2, j)) gameState.obstacles.push({x: 2, y: j});
                if (!isOccupied(GRID_WIDTH - 3, j)) gameState.obstacles.push({x: GRID_WIDTH - 3, y: j});
            }
            
            // Merkez platform
            const centerX = Math.floor(GRID_WIDTH / 2);
            const centerY = Math.floor(GRID_HEIGHT / 2);
            for (let x = centerX - 1; x <= centerX + 1; x++) {
                for (let y = centerY - 1; y <= centerY + 1; y++) {
                    if ((x === centerX && y === centerY) || isOccupied(x, y)) continue;
                    gameState.obstacles.push({x, y});
                }
            }
        }
